<title>AI経営ナビ ウォークスルー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============================================================
   AI経営ナビ ウォークスルー（操作再生版）
   暗い操作卓の中に、実際のアプリ画面を置いて「触っている」様子を再生する。
   枠の色はアプリの紺青とずらし、画面と競らせない。
   ============================================================ */
:root{
  --ground:#0F1319; --panel:#171D26; --panel-2:#1E2631;
  --line:#2A3542; --line-soft:#222C38;
  --fg:#E9EDF2; --fg-dim:#8FA0B2; --fg-faint:#66788B;
  --accent:#E0A14A; --bezel:#05080C;
  --stage-w:1060px; --stage-h:662px;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
:root[data-theme="light"]{
  --ground:#EDF0F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --line:#D3DBE4; --line-soft:#E3E9EF;
  --fg:#141A21; --fg-dim:#56677A; --fg-faint:#8494A5; --accent:#A2661A; --bezel:#C9D2DC;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#EDF0F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --line:#D3DBE4; --line-soft:#E3E9EF;
    --fg:#141A21; --fg-dim:#56677A; --fg-faint:#8494A5; --accent:#A2661A; --bezel:#C9D2DC;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.rail{position:sticky;top:0;z-index:40;display:flex;gap:3px;padding:0 22px;height:4px;background:var(--ground)}
.rail i{flex:1;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.rail i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--accent);transition:width .3s linear}
.rail i.done::after{width:100%}
.rail i.now::after{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

.top{display:flex;align-items:baseline;gap:14px;padding:16px 26px 10px;border-bottom:1px solid var(--line-soft)}
.top .mark{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.top .who{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.top .note{margin-left:auto;font-size:12px;color:var(--fg-faint)}

.deck{display:grid;grid-template-columns:var(--stage-w) minmax(300px,1fr);gap:28px;align-items:start;padding:22px 26px 0;max-width:1500px;margin:0 auto}
@media (max-width:1240px){.deck{grid-template-columns:1fr}:root{--stage-w:100%}}

/* 画面（操作卓にはめ込んだ紙面） */
.stage{position:relative;width:100%;height:var(--stage-h);background:var(--bezel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.stage .viewport{position:absolute;inset:0;overflow:hidden}
.stage .screen{position:absolute;top:0;left:0;width:1600px;transform-origin:top left;background:#EDF2F2;transition:transform .9s cubic-bezier(.22,.61,.36,1)}
.stage .screen.snap{transition:none}
.stage .tag{position:absolute;left:12px;bottom:10px;z-index:3;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:#cfd8e2;background:rgba(8,12,18,.72);backdrop-filter:blur(3px);padding:3px 8px;border-radius:4px}
.stage .live{position:absolute;right:12px;bottom:10px;z-index:3;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:#cfd8e2;background:rgba(8,12,18,.72);padding:3px 8px;border-radius:4px}
.stage .live i{width:6px;height:6px;border-radius:50%;background:#E4695F;animation:pulse 1.2s ease-in-out infinite}

/* 説明の欄 */
.notes{padding-top:2px;min-height:var(--stage-h);display:flex;flex-direction:column}
.notes[hidden],.stage[hidden]{display:none!important}
.notes .step{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);margin-bottom:8px}
.notes h2{font-family:var(--f-display);font-weight:900;font-size:24px;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35;margin:0 0 10px;text-wrap:balance;letter-spacing:.01em}
.notes .lead{color:var(--fg-dim);font-size:14px;margin:0 0 16px;max-width:38em}
.notes ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.notes li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13.4px;line-height:1.7;opacity:.42;transition:opacity .4s}
.notes li.on{opacity:1}
.notes li::before{content:"";width:5px;height:5px;margin-top:9px;border-radius:50%;background:var(--accent)}
.notes li b{font-weight:700;color:var(--fg)}
.notes .now{margin-top:auto;padding:12px 14px;border-left:2px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;font-size:13px;color:var(--fg-dim);min-height:64px;transition:opacity .25s}
.notes .now b{color:var(--fg)}
.notes .now.dim{opacity:0}

/* 全面スライド */
.slide{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:38px 44px;min-height:var(--stage-h)}
.slide.title{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(150deg,var(--panel) 0%,var(--panel-2) 100%)}
.slide.title .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--accent);margin-bottom:18px}
.slide.title h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,4.4vw,54px);line-height:1.22;margin:0 0 18px;text-wrap:balance;letter-spacing:.01em}
.slide.title p{max-width:46em;color:var(--fg-dim);font-size:15.5px;margin:0}
.slide.title .meta{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px 26px;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);letter-spacing:.06em}
.slide h2.big{font-family:var(--f-display);font-weight:900;font-size:30px;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
.slide .sub{color:var(--fg-dim);font-size:14px;margin:0 0 26px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.colhead{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);padding-bottom:8px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.scenes{display:grid;gap:14px}
.scene-item{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start}
.scene-item .n{font-family:var(--f-mono);font-size:11px;color:var(--fg-faint);padding-top:4px;min-width:3.4em}
.scene-item h3{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 2px}
.scene-item p{margin:0;font-size:13px;color:var(--fg-dim);line-height:1.65}
.feats{display:grid;gap:9px}
.feat{display:grid;grid-template-columns:auto 1fr;gap:11px;font-size:13.2px;line-height:1.65}
.feat .dot{width:6px;height:6px;margin-top:9px;border-radius:50%;background:var(--accent)}
.feat b{font-weight:700}.feat span{color:var(--fg-dim)}
.points{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.points{grid-template-columns:1fr}}
.point h4{font-family:var(--f-display);font-weight:700;font-size:14px;margin:0 0 5px;display:flex;align-items:baseline;gap:8px}
.point h4 em{font-family:var(--f-mono);font-style:normal;font-size:10.5px;color:var(--accent);letter-spacing:.1em}
.point p{margin:0;font-size:12.6px;color:var(--fg-dim);line-height:1.65}
.wrap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
@media (max-width:900px){.wrap-grid{grid-template-columns:1fr}}
.wrap-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.wrap-card h4{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 7px}
.wrap-card p{margin:0;font-size:13px;color:var(--fg-dim);line-height:1.7}
.wrap-note{margin-top:24px;font-size:12.5px;color:var(--fg-faint);border-top:1px solid var(--line);padding-top:14px}

/* 操作 */
.bar{position:sticky;bottom:0;z-index:30;margin-top:24px;display:flex;align-items:center;gap:14px;padding:12px 26px;background:var(--ground);border-top:1px solid var(--line-soft)}
.btn{font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;line-height:1}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#12161C;font-weight:700;min-width:84px}
.btn.main:hover{filter:brightness(1.08);color:#12161C}
.dots{display:flex;gap:6px;margin-left:6px;flex-wrap:wrap}
.dot-btn{width:26px;height:22px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg-faint);font-family:var(--f-mono);font-size:10px;line-height:1;padding:0}
.dot-btn[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#12161C;font-weight:500}
.bar .clock{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);letter-spacing:.08em}
.hint{padding:0 26px 22px;font-size:11.5px;color:var(--fg-faint)}
@media (prefers-reduced-motion: reduce){.stage .screen{transition:none}.rail i::after{transition:none;animation:none}}
</style>

<div class="rail" id="rail" aria-hidden="true"></div>

<header class="top">
  <span class="mark">Walkthrough</span>
  <span class="who">AI経営ナビ</span>
  <span class="note">画面はすべて実際のアプリのものです（架空企業「デモ・ホールディングス」のデータで動作）</span>
</header>

<main class="deck" id="deck">
  <div class="slide title" id="slot-slide">
    <div class="eyebrow">AI MANAGEMENT NAVIGATOR</div>
    <h1>経営の「見る・調べる・決める」を<br>ひとつの画面に</h1>
    <p>公開データの定常監視から、社内資料を横断した質問、経営計画の前提づくりと点検まで。
       経営層と経営企画の日々の仕事に沿って、実際に操作しながらご覧いただきます。</p>
    <div class="meta">
      <span>全 10 章・約 5 分</span>
      <span>自動再生／スペースキーで一時停止</span>
      <span>デモ用の架空企業データ</span>
    </div>
  </div>
  <div class="stage" id="slot-stage" hidden>
    <div class="viewport"><div class="screen" id="screen" role="img" aria-label="アプリの画面"></div></div>
    <div class="live"><i></i>OPERATING</div>
    <div class="tag" id="stage-tag"></div>
  </div>
  <div class="notes" id="slot-notes" hidden>
    <div class="step" id="n-step"></div>
    <h2 id="n-title"></h2>
    <p class="lead" id="n-lead"></p>
    <ul id="n-list"></ul>
    <div class="now dim" id="n-now"></div>
  </div>
</main>

<div class="bar">
  <button class="btn main" id="play">一時停止</button>
  <button class="btn" id="prev">← 前の章</button>
  <button class="btn" id="next">次の章 →</button>
  <div class="dots" id="dots"></div>
  <span class="clock" id="clock"></span>
</div>
<p class="hint">スペース＝再生／一時停止、←→＝章の移動、数字キー＝その章へ。番号を押しても移動できます。</p>

tainer auto-margin\" dir=\"ltr\" style=\"--start-top: 0px; --start-left: 0px; --start-width: 0px; --start-height: 0px; border-style: solid; overflow: visible; min-width: min(0px, 100%);\"><div data-testid=\"status-tracker\" class=\"wrap center hidden svelte-1uj8rng hide\" style=\"position: absolute; padding: 0px;\"></div><div class=\"html-container svelte-1jts93g\"><div id=\"html-zb60jzy7f\" class=\"prose gradio-style svelte-26mp0t\"><section class=\"mw-result\"><header><div><small>分析結果</small><h2>前提洗い出しの総括</h2></div><div class=\"mw-source-chips\"><span>対象事業：運輸</span></div></header><div class=\"mw-result-body\"><h2>前期計画から最も変わった前提（最大3件）</h2><ul><li><strong>金利：0.25%→実勢0.977%（2026-09-09）</strong>。2四半期連続乖離で修正検討入り。要変更。運輸の大型投資（車両更新・駅前開発）の資金調達コスト・投資採算に波及（前提・情勢／考慮点／素案枠の3観点で共通指摘）。</li><li><strong>人件費：+2.5%→春闘実績+3.4%</strong>。上振れで要変更。労働集約度の高い運輸の要員・人件費計画へ反映が必要で、事業利益目標（2029年430億円）の積み上げ根拠に下押し圧力（3観点で共通指摘）。</li><li><strong>電力スポット価格：25.0円/kWh→実勢12.47円/kWh（費用有利側に下振れ、期間内8〜26円と変動大）</strong>。要変更。ただし調達は市場スポットではなく契約であり、費用有利がそのまま損益に効くとは限らない（3観点で共通指摘）。</li><li>（補足）湊南市人口は277万人前提に対し実勢281.8万人で横ばい前提は概ね維持できるが、集計範囲差の確認が残る（3観点で共通指摘）。</li></ul><h2>新計画で必ず反映すべき考慮点（最大3件）</h2><ul><li><strong>事業利益目標（2029年430億円）を据え置くか下方修正するか</strong>。金利上振れ・人件費+3.4%を前提再設定した場合の可否を経営が判断する必要（前提・情勢／考慮点／素案枠）。</li><li><strong>人件費+3.4%継続下での要員計画と省力化の数値化</strong>。ダイヤ最適化・デジタル乗車券による省力化を要員・人件費計画にどう結びつけるか（前提・情勢／考慮点／素案枠）。</li><li><strong>投資の優先順位・時期分散の基準設定</strong>。金利0.98%・建設コスト高騰を踏まえ、車両更新（第2期320両）と駅前A用地・駅周辺開発の優先順位をどの基準で見直すか（金利0.5%超時の劣後案件事前指名は宿題として緊急化）（前提・情勢／考慮点／素案枠）。</li><li>（論点）電力の費用有利を損益前提に織り込む際、調達契約の長期比率を踏まえた実効単価をどこまで反映するか（考慮点／素案枠）。</li></ul><h2>計画書の骨子（章立ての要点）</h2><ul><li>前期の10章構成を土台に維持しつつ、変化点を独立枠として明示。前提条件章（金利・人件費・電力・湊南市人口の再設定と感応度・2四半期連続乖離での修正ルール）を必須化（素案枠）。</li><li>運輸1節を「需要（輸送人員：定期・定期外別）／供給・安全投資（車両更新第2期320両・耐震浸水対策・安全投資1,500億円枠継承）／成長施策（なにわ筋・新湊南連絡線、駅周辺開発、駅前A用地）／要員・人件費計画」に分解し実行単位で管理（素案枠）。</li><li><strong>要員・人件費計画を独立章化</strong>（人件費前提再設定を予算論点として明示）（素案枠）。</li><li><strong>安全・人材の非財務KPI（重大事故件数・従業員エンゲージメントスコア候補）を確定枠として独立章化</strong>。前期は未確定のまま持ち越しており、2026年9月経営会議での確定内容を新計画の全社目標へ引き継ぐ（前提・情勢／考慮点／素案枠）。</li><li>進捗管理は輸送人員（定期・定期外別）を先行指標とし、実データ接続方針と感応度確認対象（電力・人件費・金利）を明記（素案枠）。</li></ul><h2>残る確認事項</h2><ul><li>運輸の内部KPI（輸送人員・売上・営業利益・人件費）が未連携のため、需要前提と事業利益積み上げ（375→400→430）の実勢照合ができず、新計画確定前に実データ接続が必要。</li><li>電力調達単価と市場スポットの乖離（長期契約比率）：運輸部の整理結果（8月レビュー決定事項2）を待って前提・供給章へ反映。</li><li>湊南市人口の集計範囲差（前提277万人と実勢281.8万人の定義差、8月レビューで確認中）。</li><li>安全・人材の非財務KPIの2026年9月経営会議での確定内容。</li><li>各データの時点（議事要旨2026年2〜9月、電力系列2026-09-12まで、湊南市人口2026-08-01時点）は策定時に更新確認が必要。</li></ul></div><footer>作成日：2026-09-13｜AI案は確認・承認後に使用してください。</footer></section><button class=\"mw-followup-open\">この結果についてAIに聞く</button></div></div></div></div><div id=\"plan-cycle-tab-shift\" class=\"column hh-tabpane svelte-siq5d6\" style=\"flex-grow: 1; min-width: min(320px, 100%);\"><div id=\"\" class=\"block svelte-1plpy97 padded hide-container auto-margin\" dir=\"ltr\" style=\"--start-top: 0px; --start-left: 0px; --start-width: 0px; --start-height: 0px; border-style: solid; overflow: visible; min-width: min(0px, 100%);\"><div data-testid=\"status-tracker\" class=\"wrap center hidden svelte-1uj8rng hide\" style=\"position: absolute; padding: 0px;\"></div><div class=\"html-container svelte-1jts93g\"><div id=\"html-uwbo24pq0\" class=\"prose gradio-style svelte-26mp0t\"><section class=\"mw-result\"><header><div><small>分析結果</small><h2>前提・情勢の変化</h2></div><div class=\"mw-source-chips\"><span>基準計画：中期経営計画2027-2029_確定版｜確定版｜2026-09-01 更新</span></div></header><div class=\"mw-result-body\"><div class=\"mw-detected-meta\"><span>資料から読み取った計画情報</span><b>対象年度：2027-2029年度</b></div><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>運輸事業に関わる前期計画の前提のうち、金利（0.25%→実勢0.98%）と人件費（+2.5%→春闘実績+3.4%）は要変更、電力スポット価格（25円→実勢12〜13円）は費用面で有利側に乖離し新計画で単価前提の見直しが要る。湊南市人口は横ばい前提が概ね維持できるが集計範囲差の確認が残り、運輸固有の需要（輸送人員）・損益KPIが未連携のため達成度検証は現時点で不能である。</p><h2>経営判断</h2><p><strong>推奨：条件付きで新計画の前提として採用（前提3点＝金利・人件費・電力単価の再設定を条件とする）。</strong> 運輸の事業構造の骨格（安全投資1,500億円枠での車両更新、なにわ筋・新湊南連絡線の検討、駅周辺開発、デジタル乗車券）は方向性として維持できるが、コスト前提が実勢から乖離しており、前提を据え置いたまま2 ss=\"html-container svelte-1jts93g\"><div id=\"html-qi5l25hny\" class=\"prose gradio-style svelte-26mp0t\"><section class=\"mw-result\"><header><div><small>分析結果</small><h2>計画書の素案枠</h2></div><div class=\"mw-source-chips\"><span>基準計画：中期経営計画2027-2029_確定版｜確定版｜2026-09-01 更新</span></div></header><div class=\"mw-result-body\"><div class=\"mw-detected-meta\"><span>資料から読み取った計画情報</span><b>対象年度：2027-2029年度</b></div><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>前期計画（中期経営計画2027-2029 確定版）の運輸の章構成（安全投資・成長施策・先行指標）は骨格として維持できるが、電力前提の下振れ・人件費前提の上振れ・非財務KPI未確定の3点は新計画の章立てに明示的な枠を設けて反映する必要がある。輸送人員・売上・営業利益・人件費の内部KPIが未連携のため実勢照合は現時点で限定的であり、前提の方向性のみで章立てを組む段階にある。</p><h2>経営判断</h2><p><strong>推奨：条件付きで新計画の章立て素案を採用する。</strong> 前期構成を土台に、下記の変化点（電力・人件費・湊南市人口・非財務KPI）を独立した記載枠として組み込むことを条件とする。理由は、前期の10章構成が運輸の事業構造（安全・供給・需要・先行指標）を概ね網羅しており、変化点の多くは前提数値と非財務KPIの追記で対応可能なためである。</p><ul><li>代替案A（構成を大幅改編）：成立条件＝輸送人員・営業利益の内部KPIが連携され、実勢に基づく需要・採算の再設計が必要となった場合。</li><li>代替案B（前期構成を据え置き、前提数値のみ差し替え）：成立条件＝新計画を早期確定させる制約が優先し、章立て改編の工数を避ける場合。ただし非財務KPI枠が明示されず点検漏れが残る欠点がある。</li></ul><h2>最優先対応</h2><ol><li>電力スポット価格前提（計画25.0円/kWh）の見直し枠を「前提条件」章に設ける（重要度：中／根拠：中期経営計画2027-2029_確定版 第3章、監視データ 電力スポット12.47円/kWh）。</li><li>人件費前提（計画+2.5%）を春闘実績+3.4%を踏まえ再設定する枠を設ける（重要度：高／根拠：2026-08 進捗レビュー議事要旨 決定事項3）。</li><li>安全・人材の非財務KPI（重大事故件数・従業員エンゲージメントスコア候補）を「KPI・進捗管理」章に確定枠として設置（重要度：高／根拠：中期経営計画 第9章・第10章、2026-08 進捗レビュー宿題）。</li></ol><hr><h2>① 渡された資料の棚卸し</h2><table><thead><tr><th>資料名</th><th>扱う範囲</th></tr></thead><tbody><tr><td>中期経営計画2027-2029_確定版.docx</td><td>前期（現行）計画の全文。章立ての土台。運輸は第5.1章</td></tr><tr><td>2026-02_経営会議 中間審議 議事要旨</td><td>草案段階の指摘（運輸＝大型国際イベント反動減の織り込み）</td></tr><tr><td>2026-05_経営会議 確定審議 議事要旨</td><td>確定時の未反映論点（非財務KPI持ち越し）</td></tr><tr><td>2026-08_経営会議 第1四半期進捗レビュー 議事要旨</td><td>前提乖離状況（電力・人件費・人口）</td></tr><tr><td>監視データ（運輸）</td><td>湊南市人口・電力スポット・平均気温・降水量は実データ。輸送人員・売上・営業利益・人件費は未連携</td></tr></tbody></table><p>上記以外の資料は参照していない。</p><h2>② 基準・追加条件との突合（前期の想定 対 直近の実勢）</h2><table><thead><tr><th>前提／論点</th><th>前期の想定</th><th>直近の実勢</th><th>判定</th><th>出典</th></tr></thead> 内容：車両更新（第2期・累計320両）、耐震・浸水対策、計画運休基準｜反映：前期の安全投資1,500億円枠を継承。電力調達（長期契約比率）の整理状況を反映（計画第5.1章・第6.1章、2026-08進捗レビュー決定事項2）（重要度：中）。</p><p><strong>7. 成長施策（駅周辺開発・連絡線）</strong>\n目的：内部成長策を採算とともに示す｜書くべき内容：なにわ筋・新湊南連絡線の検討、主要3駅の駅周辺開発、駅前A用地の一体開発｜反映：駅前A用地の按分協定（計画第5.2・6.1章）。金利上昇局面の投資優先順位基準を反映（重要度：中）。</p><p><strong>8. 要員・人件費計画</strong>\n目的：要員数と人件費前提を明示｜書くべき内容：要員計画、人件費前提の再設定、リスキリング・再配置｜反映：人件費+2.5%→実績+3.4%を踏まえた再設定（2026-08進捗レビュー決定事項3）。人件費KPI未連携のため実勢は接続後（重要度：高）。</p><p><strong>9. 主要リスクと対応</strong>\n目的：運輸固有のリスクを整理｜書くべき内容：沿線人口減少、大規模自然災害、電力・人件費コスト、金利｜反映：電力下振れ／人件費上振れの方向差、金利0.977%（計画第8章、監視データ）（重要度：中）。</p><p><strong>10. サステナビリティ・非財務KPI</strong>\n目的：安全・人材の非財務目標を全社目標化｜書くべき内容：重大事故件数、従業員エンゲージメントスコアの目標値｜反映：前期未確定の非財務KPIを確定枠として設置（計画第9章、2026-05確定審議・2026-08進捗レビュー宿題）（重要度：高）。</p><p><strong>11. KPI・進捗管理と計画修正ルール</strong>\n目的：先行指標と修正ルールを実行単位で管理｜書くべき内容：輸送人員（定期・定期外別）、営業利益、非財務KPI、2四半期連続乖離での修正ルール｜反映：先行指標の実データ接続方針、感応度確認対象（電力・人件費・金利）（計画第10章）（重要度：中）。</p><h2>前期計画から構成を変えた箇所とその理由</h2><ul><li><strong>前期5.1章（運輸を1節に集約）を「需要（5章）／供給・安全（6章）／成長（7章）／要員・人件費（8章）」に分解</strong>：理由＝人件費上振れと輸送人員の実行単位管理を独立して扱うため。前期は1節に混在し、要員費・需要の前提が個別に見えにくかった。</li><li><strong>要員・人件費計画を独立章化（8章）</strong>：理由＝人件費前提+2.5%が実績+3.4%と乖離し、再設定が予算編成の論点になっているため（2026-08進捗レビュー）。</li><li><strong>非財務KPIを独立章化（10章）</strong>：理由＝前期は第9章のサステナビリティ内で「継続論点」として未確定のまま残ったため、確定枠として明示する。</li><li><strong>前提条件章（3章）に感応度・修正ルールを明記</strong>：理由＝電力・人件費・金利が実勢と乖離しており、方向差（電力有利／人件費・金利不利）を前提段階で示す必要があるため。</li></ul><h2>確認が必要な情報</h2><ul><li>輸送人員（定期・定期外別）・運輸の売上・営業利益・人件費：いずれも未連携のため、需要前提と採算目標の実勢照合ができない。新計画確定前に接続が必要。</li><li>湊南市人口の集計範囲：計画前提277万人と実勢281.8万人の範囲差（2026-08進捗レビューで確認中）。範囲を揃えないと前提改定の是非を判断できない。</li><li>電力調達契約の長期契約比率：市場スポットとの乖離整理（運輸部）。整理状況を前提・供給章へ反映するため要確認。</li><li>安全・人材の非財務KPI（重大事故件数・従業員エンゲージメントスコア）：2026年9月経営会議での確定状況。確定後に第10章の目標値へ反映。</li></ul><h2>管理層が議論すべき問い</h2><ol><li>電力前提を市場実勢（12円台）へ引き下げるか、調達契約の長期比率を踏まえた実効単価を採るか。前提改定の基準をどう置くか。</li><li>人件費前提を+3.4%へ改定した場合、運輸の営業利益目標（2029年430億円）を据え置くか、要員計画で吸収するか。</li><li>非財務KPIを新計画の全社目標に格上げする範囲（安全のみか、人材エンゲージメントも含めるか）をどこまで確定させるか。</li></ol></div><details class=\"rag-evide <div class=\"mw-detected-meta\"><span>資料から読み取った計画情報</span><b>対象年度：2027-2029年度</b></div><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>中期経営計画2027-2029の共通マクロ前提のうち為替・金利が計画修正ルール（2四半期連続乖離）に該当しており、金利乖離は全社の支払利息を通じて事業利益・D/Eレシオ・投資枠に横断的に効く一方、計画側の修正手続き（感応度分析・投資優先順位）が2026年9月経営会議での決定待ちのまま基準日を迎えている。前提の乖離と一部案件の遅延・停止はあるが、グループ合算計画そのものは初年度前提の再設定を条件に成立し得る状態であり、内部KPI（売上・営業利益）は未連携のため実勢での達成度検証はできていない。</p><h2>経営判断</h2><p>推奨は「条件付き実行」。理由は、計画の骨格（全社目標・投資配分・KPI設計）は維持できる水準にあるが、為替・金利の2四半期連続乖離が修正ルールの発動要件を満たしており、2027年度初年度前提の再設定と金利上昇時の投資劣後基準の確定を条件に置かなければ、事業利益・D/Eレシオの前提が崩れるためである。\n- 代替案A（要監視）：前提を据え置き四半期レビューで追跡。成立条件＝為替・金利が次四半期に計画方向へ戻る兆しがある場合。ただし現時点で実勢は計画から一貫して乖離方向（円安・金利上昇）であり、方向は結論と逆でない。\n- 代替案B（差し戻し）：初年度前提の全面再作成を求める。成立条件＝内部KPI（売上・営業利益）の実勢が入手でき、乖離が全社利益に与える影響が定量化できる場合。現状はデータ不足で過剰対応となる。</p><h2>最優先対応</h2><ol><li>為替・金利の感応度分析と2027年度初年度前提の再設定要否を確定する（責任：財務部・経営企画部／期限：2026年9月経営会議／開始条件：即時）。</li><li>金利0.5%超時に劣後させる投資案件の事前指名を確定し、成長投資3,200億円の執行順位に反映する（責任：財務部／期限：2026年9月経営会議／開始条件：即時、実勢0.98%で発動要件充足済み）。</li><li>遅延2案件（駅前A用地・共通データ基盤）の按分・連結消去ルールを確定し、成長投資の執行ペースへの影響を経営会議へ報告する（責任：不動産事業本部・情報通信事業本部・経営企画部／期限：次回四半期レビュー／開始条件：即時）。</li></ol><hr><h2>点検に用いた資料の棚卸し</h2><ul><li>中期経営計画2027-2029_確定版.docx（点検基準。前提・数値目標・投資配分・案件）</li><li>2026-05_確定審議_議事要旨（確定の経緯・未反映2件・修正ルール）</li><li>2026-08_第1四半期進捗レビュー_議事要旨（前提乖離判定・宿題進捗）</li><li>2026年度第1四半期_業績・案件進捗レポート（Q1実績・案件進捗）</li><li>セグメント別事業利益実績_2020-2026_サンプル.csv（2020-2026年度の実績・見込）</li><li>monitoring（外部指標実勢：為替・金利・不動産価格指数・電力・湊南市人口）</li><li>監視カタログ（前提・KPIの網羅点検基準）</li><li>公開月次資料（ホテル営業概況・観光取扱実績・鉄道運輸成績・航空貨物）：範囲が中計セグメントと一致しないため参考扱い</li><li>デモ・ホールディングス_PoC検証_タスク管理_share.xlsx：本件計画点検の対象外（アプリ開発管理資料）</li></ul><p>いずれも渡された範囲のみを使用。渡されていない中計本表の内部KPI実績は参照していない。</p><h2>乖離一覧（計画値・実態値・乖離幅・出典）</h2><p>対応関係：計画値＝中計確定版「3.前提条件」、実態値＝monitoring実勢および進捗レビュー。集計範囲は前提指標のため全社共通。</p><table><thead><tr><th>前提項目</th><th>計画値</th><th>実勢値</th><th>乖離幅</th><th>出典</th><th>判定</th></tr></thead><tbody><tr><td>為替（ドル円）</td><td>140円</td><td>156.11円（2026-09-04）</td><td>+約16円の円安</td><td>中計3章／monitoring（FRED DEXJPUS）</td><td>乖離・修正ルール該当（高）</td></tr><tr><td>金利（無担保コールO/N）</td><td>0.25%</td><td>0.977%（2026-09-09）</td><td>+0.73pt</td><td>中計3章／monitoring（日銀）</td><td>乖離・修正ルール該当（高）</td></tr><tr><td>電力スポット価格</td><td>25.0円/kWh</td><td>12.47円/kWh（2026-09-12）</td><td>約-12.5円（費用面は有利）</td><td>中計3章／monitoring（JEPX）</td><td>下振れ（中）</td></tr><tr><td>湊南市人口</td><td>277万人</td><td>2,818,354人（2026-08-01）</td><td>+約11.8万人</td><td>中計3章／monitoring（湊南市推計）</td><td>上振れ・集計範囲差確認中（低）</td></tr><tr><td>不動産価格指数</td><td>150</td><td>159.7（2025-12-01）</td><td>+9.7</td><td>中計3章／monitoring（国交省）</td><td>上振れ（低）※基準日から約9か月前の値</td></tr><tr><td>来訪者数</td><td>年4,000万人</td><td>前年比+12%ペース</td><td>上振れ方向</td><td>中計3章／進捗レビュー</td><td>上振れ（中）／monitoring未連携</td></tr><tr><td>人件費・賃金</td><td>+2.5%</td><td>春闘実績+3.4%</td><td>+0.9pt</td><td>中計3章／進捗レビュー</td><td>上振れ（中）</td></tr></tbody></table><p>内部KPI（各セグメント売上・営業利益）はmonitoring未連携のため、実勢での乖離判定は行えない（後述の突合表に「実態データなし」と記載）。</p><h2>計画対実勢・実績の突合（グループ合算の成立性）</h2><p>対応関係：計画値＝中計「4.全社数値目標」「5.セグメント別計画」、実勢値＝セグメント別実績CSV（2024-2026年度見込）およびQ1レポート。CSVは事業利益ベースで中計セグメント区分と一致。</p><table><thead><tr><th>項目</th><th>計画値</th><th>実勢値</th><th>乖離</th><th>出典</th><th>判定</th></tr></thead><tbody><tr><td>事業利益（起点）</td><td>2024年度1,121</td><td>2024年度1,121／2025年度1,159／2026年度見込1,197</td><td>起点から増加方向</td><td>中計4章／CSV</td><td>方向は計画整合（中）</td></tr><tr><td>事業利益 2027年度計画</td><td>1,300</td><td>実態データなし（27年度未到来）</td><td>比較不能</td><td>中計4章</td><td>監視（中）</td></tr><tr><td>運輸</td><td>2027年度400</td><td>2026見込390／Q1実績93（計画97、-4）</td><td>直近Q1は微下振れ</td><td>中計5章／CSV／Q1</td><td>監視（中）</td></tr><tr><td>不動産</td><td>2027年度490</td><td>2026見込460／Q1実績119（計画115、+4）</td><td>上振れ方向</td><td>中計5章／CSV／Q1</td><td>順調（低）</td></tr><tr><td>物流</td><td>2027年度75／2029年度105</td><td>2026見込30／Q1実績15（計画21、-6）</td><td>27年度計画まで大きな段差、Q1は下振れ</td><td>中計5章／CSV／Q1</td><td>要監視（高）</td></tr><tr><td>観光</td><td>2027年度52</td><td>2026見込42／Q1実績9（計画13、-4）</td><td>Q1下振れ</td><td>中計5章／CSV／Q1</td><td>要監視（中）</td></tr><tr><td>全社内部KPI（売上・営業利益・人件費）</td><td>各セグメント計画</td><td>実態データなし（未連携）</td><td>比較不能</td><td>monitoring</td><td>確認要（後述）</td></tr></tbody></table><p>補足：公開月次資料（観光取扱実績・鉄道運輸成績等）は連結セグメント区分・対象期間が中計と一致しないため、前年比・増減として並べない。範囲が異なるため単純比較不能。</p><h2>個別案件・施策の進捗差分</h2><p>出典：2026年度第1四半期_業績・案件進捗レポート「4.個別案件」。</p><table><thead><tr><th>案件</th><th>計画</th><th>現状</th><th>判定</th><th>グループ観点の含意</th></tr></thead><tbody><tr><td>中原1丁目計画</td><td>継続推進</td><td>建設コスト+8%で再査定中</td><td>一時停止</td><td>成長投資（不動産1,400）の執行時期・採算に影響</td></tr><tr><td>車両更新（第2期）</td><td>年度内120両</td><td>Q1で31両</td><td>計画どおり</td><td>更新・安全投資枠内で進行</td></tr><tr><td>共通データ基盤</td><td>2027年度末β版</td><td>要件定義1Q遅延・連結消去ルール確定待ち</td><td>遅延</td><td>各事業計上分100の連結消去に直結、KPI（受注残）接続に影響</td></tr><tr><td>海外不動産 北米1号</td><td>2027年度取得</td><td>DD前倒し完了</td><td>前倒し</td><td>海外600の枠内、資金前倒し需要に留意</td></tr><tr><td>駅前A用地 複合開発</td><td>2027年度着工準備</td><td>用地按分3か月遅延</td><td>遅延</td><td>不動産・運輸の投資収益按分（二重計上/カニバリ）論点</td></tr><tr><td>インバウンド富裕層商品</td><td>2026下期投入</td><td>投入予定</td><td>計画どおり</td><td>観光の第2の柱育成に整合</td></tr></tbody></table><p>選ばなかった側への一言：不動産は好調（Q1+4、価格指数上振れ）だが中原1丁目の建設コスト再査定という悪材料を抱える。物流は要監視だが、荷主構成転換の下振れシナリオ（2029年度70億円）が計画に併記済みという良材料がある。</p><h2>放置した場合のリスク</h2><ul><li>金利乖離（0.25%→0.98%）を据え置くと、支払利息増が全社事業利益を圧迫し、D/Eレシオ2029年度0.85倍目標と成長投資3,200億円の両立が崩れる経路が生じる（高／進捗レビュー・中計7章）。</li><li>為替乖離（140円→156円）を据え置くと、観光の海外観光需要減・物流採算悪化が続き、観光52・物流75（2027年度計画）の積み上げが下振れする（中／Q1レポート・中計5章）。物流は26→75と大きな段差を計画しており、Q1実績15はその方向と逆行している点を明記する。</li><li>駅前A用地・共通データ基盤の遅延を放置すると、按分・連結消去ルールが未確定のまま成長投資の執行ペースがずれ、二重計上リスクとKPI（受注残・稼働率）接続が曖昧になる（中／Q1レポート・中計5.2/5.4）。</li><li>非財務KPI未設定（2月指摘#3未反映）が続くと、全社KPIが財務3指標に偏ったまま計画の網羅性を欠く（中／確定審議議事要旨）。</li></ul><h2>対策の提案（優先度・責任部門・開始条件）</h2><ol><li>為替・金利前提の再設定と感応度分析（優先度：高／財務部・経営企画部／開始条件：2026年9月経営会議で審議、既に発動要件充足）。</li><li>金利0.5%超時の投資劣後案件の事前指名確定（優先度：高／財務部／開始条件：実勢0.98%で緊急化済み、劣後候補リストを9月提示）。</li><li>駅前A用地の投資・収益按分協定と共通データ基盤の連結消去ルール確定（優先度：中／不動産事業本部・運輸事業本部・情報通信事業本部／開始条件：次回四半期レビューまでに按分方針提示）。</li><li>人件費前提+2.5%の再設定（優先度：中／経営企画部・財務部／開始条件：2027年度予算編成時）。</li><li>安全・人材の非財務KPI選定（優先度：中／経営企画部／開始条件：2026年9月経営会議で決定）。</li><li>エンタメ悪天候年下振れ幅の実績整理（優先度：低／エンタメ事業本部／開始条件：次回四半期レビュー、過去10年データ収集中）。</li></ol><h2>確認が必要な情報</h2><ul><li> 0</b></span><span class=\"sns-words\">好きでない</span></div><p>これ以上ミュージカルGHOSTのこと好きにさせられると シアターホール で地縛霊になってしまいそうなのですが、大丈夫でしょうか?(1010は音響が好きではないため回避)</p></article><article class=\"sns-sample\"><div class=\"sns-sample-head\"><i class=\"sns-mark-text negative\">ネガティブ</i><span>2026-09-13</span><span class=\"sns-spread\" title=\"リポスト 0・引用 0・返信 0\">🔁 <b>0</b></span><span class=\"sns-likes\">♡ <b>0</b></span><span class=\"sns-words\">負担</span></div><p>本日は「ゴースト」。 シアターホール の座席は前のままです。...既に負担を感じるんですけど...😱</p></article><article class=\"sns-sample\"><div class=\"sns-sample-head\"><i class=\"sns-mark-text negative\">ネガティブ</i><span>2026-09-13</span><span class=\"sns-spread\" title=\"リポスト 0・引用 0・返信 0\">🔁 <b>0</b></span><span class=\"sns-likes\">♡ <b>0</b></span><span class=\"sns-words\">小さすぎ</span></div><p>私は仕事中で参戦すらできなかったですが、どうやら シアターホール では箱が小さすぎることが証明されたみたいですね...🍶👹</p></article><article class=\"sns-sample\"><div class=\"sns-sample-head\"><i class=\"sns-mark-text negative\">ネガティブ</i><span>2026-09-13</span><span class=\"sns-spread\" title=\"リポスト 0・引用 0・返信 0\">🔁 <b>0</b></span><span class=\"sns-likes\">♡ <b>0</b></span><span class=\"sns-words\">圧迫感</span></div><p>実家から電車🚃で シアターホール 向かってるんだけど、乗り換え検索したら 特急が早いからネットチケットとったのに普通の急行に接続してたやん💦 キャンセル料金かかるし、少しだけ早く到着するからと席いったら私の席に大きなスーツケース😩 どかしてもらったけど、横の圧迫感すごい</p></article></div></section><details class=\"sns-sec sns-sec-quality\"><summary class=\"sns-sec-head\"><span>この数字の作り方</span><small>投稿の集め方と判定の手順、数字の確からしさ</small><i class=\"sns-board-toggle\"></i></summary><div class=\"sns-sec-body\"><p class=\"sns-note sns-vol-note\"><b>投稿数（母数）の取り方。</b>Yahoo!リアルタイム検索の「投稿数の推移」API（クエリに一致した全投稿数・時間別）を62本のクエリで取り、事業ごとに表記ゆれの合計を投稿数にしています（重複はAND検索の実測で数%。97%が重なる「AR西川ガーデンズ」は数えません）。<br><b>ネガティブ投稿数の推定。</b>「投稿数 × 標本のネガ率」の比推定です。日ごとの率は標本が薄いと暴れるので、その週の率へベイズ縮約しています（事前の重み 20件）。推定の幅（縮約後の率のWilson 95%区間×投稿数）も計算していますが、図の札には出しません（2026-09-10 の指示。札は日付・件数・よく出た言葉だけ）。<br><b>盛り上がりの選び方。</b>投稿数が前週（昨日までの7日）より増えた事業を、増加率の高い順に上位5件。小さな数字が大きな倍率を作らないよう件数の下限を置きます（今週40件以上・増分15件以上）。前週が薄い事業は倍率を出さず「新たに話題に」として末尾に置きます。<br><b>火種の選び方。</b>2026-09-10 から<b>絶対値</b>です。今週のネガティブ投稿数（推定）が多い順に上位5件で、前週より増えたかどうかは順位に関係しません。下限は順位のためではなく、比推定の根拠を確かめるために置いています（今週の推定8件以上・AI判定15件以上・そのうちネガティブ4件以上）。カードに出る前週比と、率の誤差を超えた増え方か（2標本の対数比のz値、目安 z≧2.0）は参考の情報です。<br>判定は完成した日（昨日まで）だけで行い、当日は集計の途中として薄く描きます。最終取得 2026-09-13 18:50。</p><p class=\"sns-freq-note\">週次のふりかえり（直近7日と、その前の7日を比べた所見。週ごとに1行残します）</p><div class=\"sns-weekly typical\"><span class=\"sns-weekly-week\">2026-W37</span><b>否定率 8% は前の7日 7% とほぼ同じです。</b><em>直近7日 4017件／前の7日 3207件</em></div><p class=\"sns-freq-note\">測定の漏斗（取得した投稿が、各段階で何件残ったか）</p><ul class=\"sns-funnel\"><li><span>有効投稿</span><span class=\"sns-funnel-bar\"><i style=\"width:100%\"></i></span><b>4,440</b><em>取得した投稿から、ノイズと重複を除いた数</em></li><li><span>デモ・ホールディングス関連</span><span class=\"sns-funnel-bar\"><i style=\"width:99%\"></i></span><b>4,412</b><em>自社の事業 4197件・共同事業 215件を採用／非該当 28件を除外</em></li><li><span>AI判定済み</span><span class=\"sns-funnel-bar\"><i style=\"width:90%\"></i></span><b>4,017</b><em>AIの判定が付いていない 395件を除外。割合はこの件数から計算</em></li></ul><p class=\"sns-freq-note\">標本の厚み（いまの割合は何件から計算しているか）</p><p class=\"sns-instrument-note\">いまの割合は<b> 判定済み 4,017件</b>から計算しています。投稿は1日に約 686件たまります（うちAIの判定が付くものは約 625件）。直近7日がすべてこの速さでたまると、約 4,802件になります。</p><p class=\"sns-instrument-note\">件数を増やすと<b>数字のぶれは小さくなりますが、偏りは減りません</b>。投稿は無作為に集めたものではないため、件数を増やしても世の中全体（母集団）の割合に近づくとは限りません。偏りを減らすには、集める時間帯や検索語を変える必要があります。</p><p class=\"sns-freq-note\">測定器の状態（検索語を変えると数字が動きます。版が違う期間の時系列は接続できません）</p><p class=\"sns-instrument-note\">検索語はブランド名 60本、苦情の語 6本です。件数は、重複を除いた投稿数です。<br><b>15本が飽和しています（AR電車、BR電車、ARバス、ARステージ）</b>。検索で返るのは直近40件だけで、その40件が1日分に満たないため、間の投稿を取りこぼしています。取得の間隔を短くすると改善します。</p><ul class=\"sns-instrument\"><li><code>AR電鉄</code><span>ブランド名</span><b>40</b><em>2日分</em></li><li><code>AR電車</code><span>ブランド名</span><b>40</b><em>飽和（取りこぼし）</em></li><li><code>AR線</code><span>ブランド名</span><b>39</b><em>4日分</em></li><li><code>AR沿線</code><span>ブランド名</span><b>39</b><em>2日分</em></li><li><code>AR</code><span>ブランド名</span><b>39</b><em>5日分</e window.__TURNS={"search": ["<div class=\"msg user\"><div><div>直近の有価証券報告書と決算説明会の資料をもとに、当社グループの海外不動産事業の現状と、経営が注視すべき課題を教えてください。</div></div></div>", "<div class=\"msg ai\"><div class=\"bubble\"><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>海外不動産事業は現状「想定どおり推移」し、ASEAN住宅分譲を軸に事業利益はまだ小さいが、2040年に向けて投下資本・事業構成を先進国とストック型へ大きくシフトさせる成長ドライバー。経営が注視すべきは、拡大に伴う金利・為替・評価下落リスクと撤退基準の明文化です。</p><h2>次に確認すること</h2><ul><li>海外不動産事業の事業利益額と投下資本残高（現状は営業収益しか開示なく、資料上は連携なし）</li><li>為替・金利前提の感応度と、投資判断のIRRハードルレート引き上げ（+0.5pt）の付議状況</li><li>海外案件の撤退基準（IRRと保有年数）の明文化の進捗</li></ul><h2>事実（出典つき）</h2><ul><li>収益規模と方向：海外不動産事業の営業収益は前年同期44億34百万円→当中間期62億88百万円へ増加（半期報告書 2026年3月期、収益認識関係、対象2025年4-9月）。不動産事業全体でも「海外不動産事業が伸長」と記載。方向は増収。</li><li>成長構想：海外不動産の投下資本は2025年度100億円水準→2030年度250億円水準→2040年度450億円水準。エリアはASEAN70%程度→将来先進国比重上昇、事業別はストック型を35%程度まで引き上げる計画（第2四半期決算説明会・参考資料 2025年度、40ページ）。</li><li>ポートフォリオの広がり：住宅分譲は2025年9月末で64プロジェクト・約72,020戸（タイ・ベトナム中心）。加えて米国賃貸住宅・物流倉庫、豪州オフィス・物流など先進国へ拡大（同参考資料41ページ）。</li><li>会社側の現状認識：「各プロジェクトの終了タイミングで各年度は増減するが、全体として想定どおり。グループの成長ドライバー」（2024年度決算説明会 質疑応答、2025年5月）。</li></ul><h2>経営が注視すべき課題</h2><ol><li><strong>金利・為替への感応度開示不足</strong>：アナリストが感応度の定量開示を要求（決算説明会質疑メモ 2026年5月）。金利は無担保コールO/N 0.977%（日銀、2026-09-09）で、有報も金利上昇時の支払利息増を明記。海外は円安局面での取得コスト・評価に直結するため、感応度の内製化が要る。</li><li><strong>評価下落・撤退基準</strong>：有報（2026年提出、29〜31ページ）は保有資産の時価下落・国際情勢リスクを明記。投資委員会メモ（2026年7月）は海外案件承認の前提として撤退基準（IRRと保有年数）の明文化を条件化。ここが未整備なら大型承認が止まる論点。</li><li><strong>投資枠の前倒し消化</strong>：中計成長投資枠3,200億円に対し累計1,180億円（消化率37%、うち不動産620・海外260）。前倒しが続くと後年の機動枠が細る（投資委員会メモ 2026年7月）。</li></ol><p>補足：monitoringの海外不動産の営業利益・売上・建設コスト指数は未連携のため、収益性・採算の直近実数は確認できません。</p><h2>論点（管理層で議論すべき問い）</h2><ul><li>海外不動産の事業利益・IRRの実績を、ストック型/回転型/住宅分譲の別で把握できているか。ハードルレート+0.5ptで通る案件はどれか。</li><li>撤退基準（IRR水準・保有年数）の閾値をどこに置くか。既存64プロジェクトへの遡及適用はするか。</li><li>先進国比率を高める過程で、金利・為替の感応度をどこまで外部開示するか。</li></ul><p>範囲注記：上記の営業収益は連結・不動産セグメントの海外不動産サブセグメント。事業利益（構想）は別区分の目標値のため、営業収益と直接比較はできません。</p></div><details class=\"rag-evidence\"><summary>根拠を見る（社内資料・出典リスト）</summary><div class=\"rag-evidence-body\"><p>十分に関連する登録事例は見つ =\"hhRateResponse('resp-ac152bdbf96a4c01ab98c918428400f5','bad',this)\">👎 改善が必要</button><button type=\"button\" onclick=\"hhCopyResponse(this,'.bubble')\">⧉ 回答をコピー</button></div></div>"], "scenario": ["<div class=\"msg user\"><div><div>為替が1ドル170円まで円安が進み、政策金利が1.5%へ上がった場合、6事業それぞれへの影響を好影響と悪影響に分けて整理してください。</div></div></div>", "<div class=\"msg ai\"><div class=\"bubble\"><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>1ドル170円・政策金利1.5%は「これから起こり得る事象」です（基準日2026-09-13時点の実データは為替153.55円、金利0.977%＝中計2027-2029の前提140円・0.25%より既に円安・高金利側だが、170円・1.5%には未到達）。同時に起きた場合、円安は観光（インバウンド）・物流・海外不動産にプラス、金利上昇は有利子負債1兆円規模の全社にマイナスで、事業ごとに好悪が分かれます。</p><h2>経営判断</h2><p><strong>要監視</strong>。170円・1.5%は前提（140円・0.25%）から大きく乖離し、中計の修正条件（金利0.5%超で投資優先順位見直し／2四半期連続乖離で年度計画修正）に触れる水準ですが、現時点は仮定であり、感応度の定量値が根拠に無いため即断できません。四半期レビューでの感応度確認と投資選別ルールの発動を軸に監視します。</p><h2>最優先対応</h2><ol><li><strong>金利感応度の定量把握</strong>（財務部）：有利子負債1兆円規模への支払利息影響は根拠に金額が無く「要確認」。1.5%到達時の利息増と長期・固定調達比率を先に算定。なぜ重要か＝全社利益とD/Eレシオ0.85倍目標の達成可否に直結。</li><li><strong>投資選別ルールの発動準備</strong>（財務部）：投資委員会は既に実勢0.98%でIRRハードル+0.5pt引上げを9月付議中（投資委員会審議メモ2026-07）。1.5%なら劣後案件の事前指名（2026年9月経営会議の継続論点）を確定。</li><li><strong>為替感応度と方向の確認</strong>（経営企画部）：中計は「為替±10円・金利±0.25pt」を四半期で確認する仕組み（中計2027-2029 3章）。170円は前提から+30円で、感応度を積み上げて影響方向を提示。</li></ol><h2>6事業への影響整理（好影響／悪影響）</h2><p>前提：金利上昇は全社共通で支払利息増（悪影響）。以下は根拠から読み取れる方向性のみ。金額・確率は根拠に無いため置きません（推論を含む箇所は明記）。</p><table><thead><tr><th>事業</th><th>好影響</th><th>悪影響</th></tr></thead><tbody><tr><td>運輸</td><td>インバウンド旅客の押上げ（訪日対応策の記載、中計2016/2019）※推論：円安で訪日増ならプラス</td><td>動力コスト（電力・燃料）上昇圧力／利上げによる安全・車両更新投資の利息増（統合報告書2025・中計2027-2029）</td></tr><tr><td>不動産（国内）</td><td>─</td><td>建設資材・施設運営コスト増、利上げで開発採算悪化・評価下落リスク（中計2027-2029 8章、投資委員会メモ）</td></tr><tr><td>不動産（海外）</td><td>円安で外貨建て賃貸・分譲収益の円換算増（推論、収益比率は未確認）</td><td>金利上昇局面での海外不動産の評価下落・撤退リスク（決算質疑メモ質問6、投資委員会メモ「感応度再提出条件で保留」）</td></tr><tr><td>エンタメ</td><td>訪日客の観劇・観戦・物販増（クロスユース強化、中計2027-2029 5.3）※推論</td><td>運営の電力・人件費上昇</td></tr><tr><td>情報サービス</td><td>為替感応度は根拠に乏しく限定的</td><td>利上げによる投資利息増（共通データ基盤300億円等）</td></tr><tr><td>観光</td><td>訪日（インバウンド）需要の押上げ＝第2の柱育成に追い風（中計2027-2029 5.5）※推論</td><td>円安で日本発の海外観光需要減、燃油サーチャージ負担増（中計2027-2029 8章「為替の急変」対応）</td></tr><tr><td>物流</td><td>外貨建て収益の円換算増（推論、外貨建て比率は未確認）</td><td>燃料コスト上昇、運賃市況次第で採算悪化（中計2027-2029 5.6）</td></tr></tbody></table><p>補足：円安の好影響は観光・物流・海外不動産に、金利の悪影響は投資・負債の重い運輸・不動産に集中します。中計の為替前提は「観光・物流・海外不動産」に、金利前提は「全社の支払利息」に効くと明記されています（中計2027-2029 3章）。</p><h2>反証・結論に反する材料</h2><ul><li>円安は観光事業でプラス（インバウンド）とマイナス（海外観光需要減）の両面を持ち、一方向に断定できません（決算質疑メモ質問1）。</li><li>インバウンド需要の為替弾力性、海外物流・海外不動産の外貨建て収益比率は根拠に数値が無く、円安の好影響の大きさは確認できません（要確認）。</li><li>金利は実データで0.977%（+34.4%、monitoring_series）と上昇方向ですが、直近は横ばい圏。為替は実データで153.55円と足元は円高方向（-4.1%）に振れており、170円は現状のトレンドと逆向きです。方向が結論（円安進行前提）と逆に動いている点は省かず記載します。</li></ul><h2>今後のリスクとチャンス（1件ずつ）</h2><ul><li>リスク：金利1.5%到達時、有利子負債1兆円規模の利息増でD/Eレシオ0.85倍目標と成長投資3,200億円・還元50%の両立が崩れる（決算質疑メモ質問2、中計2027-2029 6章）。</li><li>チャンス：170円の円安が続けば、海外不動産・物流・インバウンドで外貨・訪日収益が伸び、成長の第2の柱育成が前倒しできる可能性（推論、外貨比率は要確認）。</li></ul><h2>対応開始条件</h2><ul><li>投資選別（IRRハードル引上げ・劣後案件指名）：<strong>金利が実勢0.98%を超えた時点で準備、1.5%到達で発動</strong>（投資委員会メモの+0.5pt方針、金利0.5%超で優先順位見直しの継続論点に基づく）。</li><li>年度計画の修正検討：<strong>前提（為替140円・金利0.25%）からの乖離が2四半期連続</strong>（中計2027-2029 10章）。</li><li>海外不動産の再査定：<strong>金利上昇＋為替変動の感応度再提出</strong>（投資委員会メモ、当案件は保留中）。</li></ul><h2>撤回条件</h2><ul><li>投資選別の緩和：<strong>金利が0.5%以下に低下し2四半期継続</strong>（根拠は0.5%を投資優先順位の閾値とする継続論点。1.5%からの撤回水準そのものは根拠に無く、閾値設定にはグループの支払利息感応度データが必要）。</li><li>為替対応（燃油サーチャージ・海外観光商品縮小）の巻き戻し：<strong>為替が前提140円圏へ回帰</strong>（撤回の具体水準は根拠に無く、要設定）。</li></ul><h2>意思決定メモ（利用者の最終確認が必要）</h2><ul><li>結論：170円・1.5%は将来仮定。中計前提からの乖離を監視し、金利上昇局面では投資選別と負債圧縮を優先。</li><li>担当：財務部（感応度・投資選別）、経営企画部（為替感応度・計画修正判断）。</li><li>期限：2026年9月経営会議（投資優先順位・劣後案件指名の確定論点）。</li><li>開始条件／撤回条件：上記見出しのとおり。</li><li>次回確認日：四半期レビュー（次回は2026年8月以降の直近レビュー）。</li><li><strong>未確定事項</strong>：支払利息の感応度金額、インバウンドの為替弾力性、海外事業の外貨建て収益比率は未取得。これらが揃うまで影響の大きさは断定不可。</li></ul><p>（取扱量指数・輸送人員などは未連携のため、需要面の実数は確認できません。判断は上記の実データと計画前提で行っています。）</p><h2>管理層が議論すべき問い</h2><ol><li>金利1.5%時の支払利息増を、成長投資3,200億円・総還元50%のどちらで吸収するか。</li><li>円安の好影響（インバウンド・海外事業）を取りに行くため、海外不動産600億円の投資・撤退基準をどう置くか。</li><li>為替と金利が逆方向に振れた場合（円高＋利上げ等）の複合シナリオも監視対象に加えるか。</li></ol></div><details class=\"rag-evidence\"><summary>根拠を見る（社内資料・出典リスト）</summary><div class=\"rag-evidence-body\"><h5>登録事例</h5><ul><li><strong>2016年 マイナス金利政策</strong>（関連度 弱・80%）<br>\nマイナス金利政策（マイナスきんりせいさく、英: negative interest rate policy）とは、中央銀行が名目金利をゼロ未満のマイナス金利に設定する金融政策。金融緩和政策の一種。\n金融機関による中央銀行への余剰預金に金利を支払うようにすることで、金融機関に融資や投資へ資金を回すように促し、経済を刺激させる目的で行われる。<br>\n対応：</li><li><strong>2022年 2022年の急速な円安</strong>（関連度 弱・78%）<br>\n円相場（えんそうば）は、円に対する外貨の相対的価値（為替レート）のこと。通常は外貨1単位に相当する円貨額で表示する（通貨や市場によっては別の慣行もある）。\n特に、米ドルやユーロとの比較によって示され、その中でも、米ドルに対する円の相対価値を示すことがある。<br>\n対応：</li><li><strong>2013年 量的・質的金融緩和</strong>（関連度 弱・75%）<br>\n大規模金融緩和が金利、為替、不動産投資環境に長期的影響を与えた。<br>\n対応：</li><li><strong>2023–年 賃上げの拡大</strong>（関連度 弱・75%）<br>\n物価上昇と人手不足を背景に賃上げが進み、人件費、採用競争、価格転嫁、生産性向上が一体の課題となった。<br>\n対応：</li></ul><h5>デモ・ホールディングス内部資料・開示資料</h5><ul><li><strong>中期経営計画2016-2018_確定版.docx</strong>（全文）<br>\n…017年3月期〜2019年3月期)/2016年5月 取締役会承認</li></ul><p>1. 経営環境認識訪日外国人観光者は2015年に1,970万人と急増し、百貨店・ホテル・交通の消費を押し上げている。マイナス金利政策(2016年2月導入)により調達環境は歴史的な低水準にあり、成長投資の好機である。一方、人口減少の先行きと郊外部の沿線需要の頭打ちが中長期の課題であり、沿線価値の向上と非鉄道事業の育成による収益源の多様化を進める。</p><p>2. 計画の主要前提前提項目想定備考為替(USD/JPY)\n115円期間平均長期金利\n△0.05%〜0.10%\nマイナス金利政策の継続訪日外国人観光者数\n2016年2,300万人→2018年3,000万人湊南空港経由の増勢継続鉄道輸送人員年率+0.5%\n訪日・沿線開発効果原油(ドバイ)\n45ドル/バレル低位安定百貨店売上(湊南圏)\n前年並み訪日免税が下支え建設コスト指数\n2015年度比+1.5%/年</p><p>3. グループ数値目標…\n- <strong>中期経営計画2022-2025_確定版.docx</strong>（全文）<br>\n…承認</p><p>1. 経営環境認識新型コロナウイルス感染症の影響から段階的な回復期に入る。鉄道・ホテル・観光の需要は2019年度比で未回復の水準から計画期間内に80〜95%への回復を見込む。訪日外国人は2023年度以降に本格回復し、2025年度に2019年度比90%と想定する。働き方の変化(在宅勤務の定着)により定期利用は構造的に2019年度比85%で下げ止まると想定する。</p><p>2. 計画の主要前提前提項目想定備考為替(USD/JPY)\n115円期間平均長期金利\n0.10%\n10年国債利回り政策金利\n△0.1%(マイナス金利継続)\n日銀金融政策の継続を想定電力スポット価格\n12円/kWh\nJEPX平均原油(ドバイ)\n70ドル/バレル</p><p>鉄道輸送人員(対2019年度比)\n2022年度85%→2025年度92%\n定期85%で下げ止まり訪日外国人(対2019年度比)\n2023年度50%→2025年度90%</p><p>建設コスト指数\n2021年度比+3%…\n- <strong>中期経営計画2013-2015_確定版.docx</strong>（全文）<br>\n…取締役会承認</p><p>1. 経営環境認識政権交代後の金融緩和・財政出動(いわゆるアベノミクス)に function openClipped(){
  // アプリは画面1枚に収める作りなので、あちこちの箱が「中だけスクロール」になっている。
  // 長い紙として見せるため、中身より低い箱を見つけて、その連なりの高さの縛りを外す。
  // 横並び（flex）の指定は触らない。前に一律で触ったときは要素が重なった。
  for (let round = 0; round < 3; round++){
    const bad = [...app.querySelectorAll("*")].filter(e =>
      e.clientHeight > 300 && e.scrollHeight - e.clientHeight > 40 &&
      !e.closest(".demo-cursor") && !/^(TEXTAREA|SELECT)$/.test(e.tagName));
    if (!bad.length) break;
    for (const e0 of bad){
      let e = e0;
      while (e && e !== app){
        for (const [k,v] of [["height","auto"],["max-height","none"],["min-height","0"],["overflow","visible"],["overflow-y","visible"]])
          e.style.setProperty(k, v, "important");
        e = e.parentElement;
      }
    }
  }
}

function hideResults(viewSel, btnText){
  const view = shadow.querySelector(viewSel); if (!view) return;
  const kids = [...view.children];
  const i = kids.findIndex(e => (e.textContent||"").includes(btnText));
  // 結果のタブは .hh-tabpane.is-active{display:block!important} で出る作りなので、
  // 隠すほうも !important でないと負ける（押す前からレポートが見えていた原因）。
  kids.slice(i + 1).forEach(e => { e.dataset.demoResult = "1"; e.style.setProperty("display", "none", "important"); });
}
function revealResults(viewSel){
  shadow.querySelectorAll(`${viewSel} [data-demo-result]`).forEach(e => { e.style.removeProperty("display"); e.classList.add("demo-reveal"); });
  openClipped();
}

function showView(id, snap){
  shadow.querySelectorAll(".hh-view").forEach(e => e.classList.toggle("hh-show", e.id === id || (id === "view-planpremise" && e.id === "view-planning")));

/* ── 位置合わせ ───────────────────────────────── */
function fit(){
  const box = stage.getBoundingClientRect();
  scale = box.width / 1600;
  openClipped();
  pan(panY, true);
}
function visibleH(){ return stage.getBoundingClientRect().height / scale; }
function contentH(){
  const shown = [...shadow.querySelectorAll(".hh-view.hh-show")];
  const bottom = Math.max(1000, ...shown.map(v => { const p = scenePos(v); return p.y + p.h; }));
  return bottom + 24;
}
function pan(y, snap){
  const maxY = Math.max(0, contentH() - visibleH());
  panY = Math.max(0, Math.min(maxY, y));
  screen.classList.toggle("snap", !!snap);
  screen.style.transform = `translateY(${-panY * scale}px) scale(${scale})`;
  const sb = app && app.querySelector(".hh-sidebar");
  if (sb){ sb.classList.toggle("snap", !!snap); sb.style.height = visibleH() + "px"; sb.style.transform = `translateY(${panY}px)`; }
  if (snap) requestAnimationFrame(() => { screen.classList.remove("snap"); sb && sb.classList.remove("snap"); });
}
function scenePos(el){
  const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
  return { x:(r.left - a.left)/scale, y:(r.top - a.top)/scale, w:r.width/scale, h:r.height/scale };
}
async function panTo(el, offset, tk){
  openClipped();
  const p = scenePos(el);
  // 要素が見えている範囲に入っていれば動かさない
  const top = p.y - offset;
  if (p.y >= panY + 40 && p.y + Math.min(p.h, 400) <= panY + visibleH() - 40) return;
  pan(top, false);
  await sleep(950, tk);
}

/* ── カーソル ─────────────────────────────────── */
function findEl(sel, text, root){
  const scope = root ? shadow.querySelector(root) : shadow;
  const list = [...scope.querySelectorAll(sel)];
  if (text == null) return list[0] || null;
  return list.find(e => (e.textContent||"").replace(/\s+/g," ").includes(text)) || null;
}
async function moveTo(el, tk, dx = 0, dy = 0){
  cursor.classList.add("on");
  await panTo(el, 220, tk);
  const p = scenePos(el);
  cursor.style.left = (p.x + Math.min(p.w/2, 120) + dx) + "px";
  cursor.style.top  = (p.y + p.h/2 + dy) + "px";
  await sleep(650, tk);
  el.classList.add("demo-hover");
  await sleep(320, tk);
}
async function click(el, tk){
  const x = parseFloat(cursor.style.left), y = parseFloat(cursor.style.top);
  ripple.style.left = x + "px"; ripple.style.top = y + "px";
  ripple.classList.remove("go"); void ripple.offsetWidth; ripple.classList.add("go");
  el.classList.remove("demo-hover");
  await sleep(380, tk);
}
async function press(sel, text, tk, root){
  const el = findEl(sel, text, root);
  if (!el) { console.warn("見つからない:", sel, text); return null; }
  await moveTo(el, tk);
  await click(el, tk);
  return el;
}
function hideCursor(){ cursor.classList.remove("on"); }

async function type(el, text, tk){

/* 回答待ちの吹き出し（アプリの progress_bubble_html と同じ作り） */
const STEPS = ["質問の意図を読み取っています","社内資料・開示資料から根拠を検索しています","該当ページの前後を読み込んでいます","回答を作成しています"];
const DONE  = {"質問の意図を読み取っています":"質問の意図を読み取りました","該当ページの前後を読み込んでいます":"該当ページの前後を読み込みました"};
const done = s => DONE[s] || (s.endsWith("しています") ? s.slice(0,-5)+"しました" : s);
async function thinking(box, tk, secs){
  const msg = el(`<div class="msg ai"><div class="bubble"><div class="ai-progress"><ul class="ai-steps"></ul></div></div></div>`);
  box.appendChild(msg); openClipped();
  const ul = msg.querySelector(".ai-steps");
  for (let i = 0; i < STEPS.length; i++){
    ul.innerHTML = STEPS.slice(0,i).map(s=>`<li class="is-done">${done(s)}</li>`).join("")
                 + `<li class="is-now"><span class="spinner"></span>${STEPS[i]}</li>`;
    await panTo(msg, 260, tk);
    await sleep(secs[i] || 900, tk);
  }
  return msg;
}
/* 回答を段落ごとに流し込む（本物も逐次表示なので、同じ見え方にする） */
async function stream(box, html, tk, follow = true, budgetMs = 24000){
  const src = el(html);                      // <div class="msg ai"><div class="bubble"><div class="chat-answer">…
  const answer = src.querySelector(".chat-answer") || src.querySelector(".bubble") || src;
  const parts = [...answer.childNodes].filter(n => n.nodeType === 1 || (n.nodeType === 3 && n.textContent.trim()));
  const totalLen = parts.reduce((a, n) => a + (n.textContent||"").length, 0);
  answer.innerHTML = "";
  box.appendChild(src);
  const caret = el(`<span class="ai-stream-caret"></span>`);
  answer.appendChild(caret);
  let shown = 0;
  for (const n of parts){
    if (n.nodeType === 1) n.classList.add("demo-reveal");
    answer.insertBefore(n, caret);
    shown++;
    if (shown % 6 === 1) openClipped();
    if (follow && shown % 2 === 0) await panTo(n, visibleH() - 260, tk);
    const len = (n.textContent||"").length;
    await sleep(Math.max(220, Math.min(1400, budgetMs * (len + 40) / (totalLen + 40 * parts.length))), tk);
  }
  caret.remove();
  return src;
}

/* 処理中の帯（アプリの hhAiBusy と同じ見た目で、見えている位置に置く） */
async function busy(label, secs, tk){
  let band = shadow.querySelector("#hh-ai-global");
  if (!band){
    band = el(`<div id="hh-ai-global" class="hh-ai-global" role="status"><span class="hh-ai-global-spin"></span><span class="hh-ai-global-body"><span class="hh-ai-global-txt"></span><span class="hh-ai-bar"><i></i></span></span><span class="hh-ai-pct"></span></div>`);
    app.appendChild(band);
  }
  band.querySelector(".hh-ai-global-txt").textContent = label;
  band.style.top = (panY + 18) + "px";
  band.classList.add("is-on");
  const bar = band.querySelector(".hh-ai-bar i"), pct = band.querySelector(".hh-ai-pct");
  const t0 = performance.now();
  while (true){
    const p = Math.min(1, (performance.now() - t0) / (secs*1000));
    // 本物と同じく、終盤はゆっくり（100%で止まらないよう95%まで）
    const shown = Math.round((1 - Math.pow(1-p, 2)) * 95);
    bar.style.width = shown + "%"; pct.textContent = shown + "%";
    if (p >= 1) break;
    await sleep(120, tk);
  }
  bar.style.width = "100%"; pct.textContent = "100%";
  await sleep(300, tk);
  band.classList.remove("is-on");
}

/* ── 進行 ─────────────────────────────────────── */
ACTS.forEach((a, i) => {
  const seg = document.createElement("i"); rail.appendChild(seg);
  const b = document.createElement("button"); b.className = "dot-btn"; b.textContent = i + 1; b.title = a.label;
  b.addEventListener("click", () => go(i)); dots.appendChild(b);
});

function render(i){
  const a = ACTS[i];
  document.querySelectorAll("#slot-slide").forEach(e => e.remove());
  if (a.slide){
    stage.hidden = true; notes.hidden = true;
    deck.insertAdjacentHTML("afterbegin", SLIDES[a.slide]);
  } else {
    stage.hidden = false; notes.hidden = false;
    $("#stage-tag").textContent = a.tag || "";
    $("#n-now").classList.add("dim");
    fit();
  }
  [...dots.children].forEach((b, j) => b.setAttribute("aria-current", j === i ? "true" : "false"));
  [...rail.children].forEach((seg, j) => { seg.classList.toggle("done", j < i); seg.classList.toggle("now", j === i); seg.style.setProperty("--p", j < i ? "100%" : (j === i ? "35%" : "0%")); });
  clock.textContent = `${String(i+1).padStart(2,"0")} / ${String(ACTS.length).padStart(2,"0")}　${a.label}`;
}

async function go(i){
  token++;
  const tk = token;
  act = (i + ACTS.length) % ACTS.length;
  mount();                                   // 章の頭ごとにアプリを初期状態から立て直す
  // それより前の章で起きたことのうち、画面に残るべき状態だけを先に作る
  for (let j = 2; j < act; j++) if (ACTS[j].prepare) ACTS[j].prepare();
  if (ACTS[act].prepare) ACTS[act].prepare();
  render(act);
  hideCursor();
  try {
    await ACTS[act].run(tk);
    if (tk !== token) return;
    if (autoAdvance) go(act + 1);
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

function setPlaying(on){
  playing = on;
  playBtn.textContent = on ? "一時停止" : "再生";
  clock.textContent = `${String(act+1).padStart(2,"0")} / ${String(ACTS.length).padStart(2,"0")}　${ACTS[act].label}${on ? "" : "　（一時停止中）"}`;
}
playBtn.addEventListener("click", () => setPlaying(!playing));
$("#prev").addEventListener("click", () => go(act - 1));
$("#next").addEventListener("click", () => go(act + 1));
addEventListener("keydown", e => {
  if (e.key === " "){ e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") go(act + 1);
  else if (e.key === "ArrowLeft")  go(act - 1);
  else if (/^[1-9]$/.test(e.key))  go(+e.key - 1);
  else if (e.key === "0") go(9);
});
addEventListener("resize", () => { if (app) fit(); });

go(0);
</script>
