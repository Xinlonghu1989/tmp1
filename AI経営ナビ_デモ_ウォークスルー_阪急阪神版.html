<title>AI経営ナビ ウォークスルー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============================================================
   AI経営ナビ ウォークスルー（操作再生版）
   暗い操作卓の中に、実際のアプリ画面を置いて「触っている」様子を再生する。
   枠の色はアプリの紺青とずらし、画面と競らせない。
   ============================================================ */
:root{
  --ground:#0F1319; --panel:#171D26; --panel-2:#1E2631;
  --line:#2A3542; --line-soft:#222C38;
  --fg:#E9EDF2; --fg-dim:#8FA0B2; --fg-faint:#66788B;
  --accent:#E0A14A; --bezel:#05080C;
  --stage-w:1060px; --stage-h:662px;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
:root[data-theme="light"]{
  --ground:#EDF0F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --line:#D3DBE4; --line-soft:#E3E9EF;
  --fg:#141A21; --fg-dim:#56677A; --fg-faint:#8494A5; --accent:#A2661A; --bezel:#C9D2DC;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#EDF0F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --line:#D3DBE4; --line-soft:#E3E9EF;
    --fg:#141A21; --fg-dim:#56677A; --fg-faint:#8494A5; --accent:#A2661A; --bezel:#C9D2DC;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.rail{position:sticky;top:0;z-index:40;display:flex;gap:3px;padding:0 22px;height:4px;background:var(--ground)}
.rail i{flex:1;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.rail i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--accent);transition:width .3s linear}
.rail i.done::after{width:100%}
.rail i.now::after{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

.top{display:flex;align-items:baseline;gap:14px;padding:16px 26px 10px;border-bottom:1px solid var(--line-soft)}
.top .mark{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.top .who{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.top .note{margin-left:auto;font-size:12px;color:var(--fg-faint)}

.deck{display:grid;grid-template-columns:var(--stage-w) minmax(300px,1fr);gap:28px;align-items:start;padding:22px 26px 0;max-width:1500px;margin:0 auto}
@media (max-width:1240px){.deck{grid-template-columns:1fr}:root{--stage-w:100%}}

/* 画面（操作卓にはめ込んだ紙面） */
.stage{position:relative;width:100%;height:var(--stage-h);background:var(--bezel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.stage .viewport{position:absolute;inset:0;overflow:hidden}
.stage .screen{position:absolute;top:0;left:0;width:1600px;transform-origin:top left;background:#EDF2F2;transition:transform .9s cubic-bezier(.22,.61,.36,1)}
.stage .screen.snap{transition:none}
.stage .tag{position:absolute;left:12px;bottom:10px;z-index:3;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:#cfd8e2;background:rgba(8,12,18,.72);backdrop-filter:blur(3px);padding:3px 8px;border-radius:4px}
.stage .live{position:absolute;right:12px;bottom:10px;z-index:3;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:#cfd8e2;background:rgba(8,12,18,.72);padding:3px 8px;border-radius:4px}
.stage .live i{width:6px;height:6px;border-radius:50%;background:#E4695F;animation:pulse 1.2s ease-in-out infinite}

/* 説明の欄 */
.notes{padding-top:2px;min-height:var(--stage-h);display:flex;flex-direction:column}
.notes[hidden],.stage[hidden]{display:none!important}
.notes .step{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);margin-bottom:8px}
.notes h2{font-family:var(--f-display);font-weight:900;font-size:24px;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35;margin:0 0 10px;text-wrap:balance;letter-spacing:.01em}
.notes .lead{color:var(--fg-dim);font-size:14px;margin:0 0 16px;max-width:38em}
.notes ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.notes li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13.4px;line-height:1.7;opacity:.42;transition:opacity .4s}
.notes li.on{opacity:1}
.notes li::before{content:"";width:5px;height:5px;margin-top:9px;border-radius:50%;background:var(--accent)}
.notes li b{font-weight:700;color:var(--fg)}
.notes .now{margin-top:auto;padding:12px 14px;border-left:2px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;font-size:13px;color:var(--fg-dim);min-height:64px;transition:opacity .25s}
.notes .now b{color:var(--fg)}
.notes .now.dim{opacity:0}

/* 全面スライド */
.slide{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:38px 44px;min-height:var(--stage-h)}
.slide.title{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(150deg,var(--panel) 0%,var(--panel-2) 100%)}
.slide.title .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--accent);margin-bottom:18px}
.slide.title h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,4.4vw,54px);line-height:1.22;margin:0 0 18px;text-wrap:balance;letter-spacing:.01em}
.slide.title p{max-width:46em;color:var(--fg-dim);font-size:15.5px;margin:0}
.slide.title .meta{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px 26px;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);letter-spacing:.06em}
.slide h2.big{font-family:var(--f-display);font-weight:900;font-size:30px;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
.slide .sub{color:var(--fg-dim);font-size:14px;margin:0 0 26px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.colhead{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);padding-bottom:8px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.scenes{display:grid;gap:14px}
.scene-item{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start}
.scene-item .n{font-family:var(--f-mono);font-size:11px;color:var(--fg-faint);padding-top:4px;min-width:3.4em}
.scene-item h3{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 2px}
.scene-item p{margin:0;font-size:13px;color:var(--fg-dim);line-height:1.65}
.feats{display:grid;gap:9px}
.feat{display:grid;grid-template-columns:auto 1fr;gap:11px;font-size:13.2px;line-height:1.65}
.feat .dot{width:6px;height:6px;margin-top:9px;border-radius:50%;background:var(--accent)}
.feat b{font-weight:700}.feat span{color:var(--fg-dim)}
.points{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.points{grid-template-columns:1fr}}
.point h4{font-family:var(--f-display);font-weight:700;font-size:14px;margin:0 0 5px;display:flex;align-items:baseline;gap:8px}
.point h4 em{font-family:var(--f-mono);font-style:normal;font-size:10.5px;color:var(--accent);letter-spacing:.1em}
.point p{margin:0;font-size:12.6px;color:var(--fg-dim);line-height:1.65}
.wrap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
@media (max-width:900px){.wrap-grid{grid-template-columns:1fr}}
.wrap-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.wrap-card h4{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 7px}
.wrap-card p{margin:0;font-size:13px;color:var(--fg-dim);line-height:1.7}
.wrap-note{margin-top:24px;font-size:12.5px;color:var(--fg-faint);border-top:1px solid var(--line);padding-top:14px}

/* 操作 */
.bar{position:sticky;bottom:0;z-index:30;margin-top:24px;display:flex;align-items:center;gap:14px;padding:12px 26px;background:var(--ground);border-top:1px solid var(--line-soft)}
.btn{font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;line-height:1}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#12161C;font-weight:700;min-width:84px}
.btn.main:hover{filter:brightness(1.08);color:#12161C}
.dots{display:flex;gap:6px;margin-left:6px;flex-wrap:wrap}
.dot-btn{width:26px;height:22px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg-faint);font-family:var(--f-mono);font-size:10px;line-height:1;padding:0}
.dot-btn[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#12161C;font-weight:500}
.bar .clock{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);letter-spacing:.08em}
.hint{padding:0 26px 22px;font-size:11.5px;color:var(--fg-faint)}
@media (prefers-reduced-motion: reduce){.stage .screen{transition:none}.rail i::after{transition:none;animation:none}}
</style>

<div class="rail" id="rail" aria-hidden="true"></div>

<header class="top">
  <span class="mark">Walkthrough</span>
  <span class="who">AI経営ナビ</span>
  <span class="note">画面はすべて実際のアプリのものです（実際のデータで動作）</span>
</header>

<main class="deck" id="deck">
  <div class="slide title" id="slot-slide">
    <div class="eyebrow">AI MANAGEMENT NAVIGATOR</div>
    <h1>経営の「見る・調べる・決める」を<br>ひとつの画面に</h1>
    <p>公開データの定常監視から、社内資料を横断した質問、経営計画の前提づくりと点検まで。
       経営層と経営企画の日々の仕事に沿って、実際に操作しながらご覧いただきます。</p>
    <div class="meta">
      <span>全 10 章・約 5 分</span>
      <span>自動再生／スペースキーで一時停止</span>
      <span>実データ</span>
    </div>
  </div>
  <div class="stage" id="slot-stage" hidden>
    <div class="viewport"><div class="screen" id="screen" role="img" aria-label="アプリの画面"></div></div>
    <div class="live"><i></i>OPERATING</div>
    <div class="tag" id="stage-tag"></div>
  </div>
  <div class="notes" id="slot-notes" hidden>
    <div class="step" id="n-step"></div>
    <h2 id="n-title"></h2>
    <p class="lead" id="n-lead"></p>
    <ul id="n-list"></ul>
    <div class="now dim" id="n-now"></div>
  </div>
</main>

<div class="bar">
  <button class="btn main" id="play">一時停止</button>
  <button class="btn" id="prev">← 前の章</button>
  <button class="btn" id="next">次の章 →</button>
  <div class="dots" id="dots"></div>
  <span class="clock" id="clock"></span>
</div>
<p class="hint">スペース＝再生／一時停止、←→＝章の移動、数字キー＝その章へ。番号を押しても移動できます。</p>

tainer auto-margin\" dir=\"ltr\" style=\"--start-top: 0px; --start-left: 0px; --start-width: 0px; --start-height: 0px; border-style: solid; overflow: visible; min-width: min(0px, 100%);\"><div data-testid=\"status-tracker\" class=\"wrap center hidden svelte-1uj8rng hide\" style=\"position: absolute; padding: 0px;\"></div><div class=\"html-container svelte-1jts93g\"><div id=\"html-kd9jsidhc\" class=\"prose gradio-style svelte-26mp0t\"><section class=\"mw-result\"><header><div><small>分析結果</small><h2>前提・情勢の変化</h2></div><div class=\"mw-source-chips\"><span>基準計画：中期経営計画2027-2029_確定版｜確定版｜2026-09-01 更新</span></div></header><div class=\"mw-result-body\"><div class=\"mw-detected-meta\"><span>資料から読み取った計画情報</span><b>対象年度：2027-2029年度</b></div><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>都市交通の前期計画前提のうち、金利（0.25%→実勢約0.98%）と人件費（+2.5%→春闘+3.4%）は既に2四半期連続乖離または上振れが確認されており、新計画では要変更である。一方で電力スポット価格は費用面で有利に振れているが調達単価との差が未整理で、需要前提（旅客輸送人員）は実勢が未連携のため成否を判定できない。</p><h2>経営判断</h2><p>推奨は「条件付きで新計画策定に着手（要監視）」。理由は、金利・人件費・電力の3前提は変化方向と根拠資料が明確で新計画の再設定材料が揃う一方、都市交通の中核である需要前提（旅客輸送人員・単価・稼働）を裏付ける実勢データが揃わず、事業利益目標（375→400→430億円）の妥当性検証が現時点で完了できないため。\n- 代替案A（そのまま維持）：成立条件は前提乖離が一時的と判断できること。ただし金利・人件費は2026-08時点で明確に上振れ方向であり、この条件は現状成立しにくい。\n- 代替案B（全面差し戻し）：成立条件は需要前提の誤りが確認されること。現状は実勢データ欠落であり「誤り確認」ではないため過剰。</p><h2>最優先対応（最大3件）</h2><ol><li>都市交通の人件費前提を+2.5%から実勢（春闘+3.4%）ベースへ再設定し、要員・車両更新（累計320両）計画の人件費影響を試算する（責任部門：経営企画部・都市交通事業本部、期限：2027年度予算編成時／2026-08経営会議決定事項3、開始条件：あり）。</li><li>電力スポット価格が計画前提25円/kWhを下回って推移しているため、調達契約の長期契約比率を整理し、費用面の恩恵が損益に反映される構造かを確認する（責任部門：運輸部、期限：要設定／2026-08経営会議決定事項2）。</li><li>安全・人材の非財務KPI（重大事故件数・エンゲージメントスコア候補）を新計画の都市交通KPIとして確定し、反映先を第9章・第10章に定める（責任部門：経営企画部、期限：2026-09経営会議／確定版第9章の継続論点）。</li></ol><hr><h2>① 渡された資料の棚卸し</h2><ul><li><strong>中期経営計画2027-2029_確定版.docx</strong>（全文、2026-09-01更新）：前期（現行）計画の前提・数値目標・都市交通施策。本点検の主対象。</li><li><strong>2026-05_経営会議_確定審議_議事要旨</strong>（全文）：確定時の計画前提一覧、未反映宿題2件、継続論点。</li><li><strong>2026-08_経営会議_第1四半期進捗レビュー_議事要旨</strong>（全文）：計画前提の直近乖離状況、都市交通の電力調達・人件費に関する決定事項。</li><li><strong>2026-02_経営会議_中間審議_議事要旨</strong>（全文）：都市交通の万博反動減など指摘事項。</li><li><strong>監視データ（都市交通）</strong>：人口・平均気温・降水量・電力スポット価格は実データ。旅客輸送人員・売上・営業利益・人件費は未連携。</li><li><strong>monitoring_series</strong>：電力スポット価格（週次、2026-06-13〜2026-09-12）の集計済み数値。</li></ul><p>（注：金利0.977%・為替156.11円・不動産価格指数159.7は監視データ上「グループ開発室／不動産／旅行」の系列だが、全社共通前提のため都市交通の突合でも参照する。都市交通固有系列ではない点を明示する。）</p><h2>② 前提の突合表</h2><table><thead><tr><th>前提</th><th>前期計画の想定</th><th>直近の実勢・推移</th><th>判定</th><th>出典</th></tr></thead><tbody><tr><td>電力スポット価格</td><td>25.0円/kWh（2025年度上限を保守設定）</td><td>12.47円/kWh（2026-09-12）。期間平均は週次で11〜22円台を推移、変化率+11.3%（2026-06-13〜09-12）</td><td>要変更（水準は下振れ、ただし方向は期間内で反発あり）</td><td>確定版3章／monitoring_series／2026-08レビュー</td></tr><tr><td>大阪市人口</td><td>277万人（横ばい）</td><td>2,818,354人＝約281.8万人（2026-08-01、微増2817627→2818354）</td><td>要変更（集計範囲差を確認のうえ。2026-08レビューでも「集計範囲の差を確認中」）</td><td>確定版3章／大阪市推計人口／2026-08レビュー</td></tr><tr><td>金利（無担保コールO/N）</td><td>0.25%（据え置き前提）</td><td>0.977%（2026-09-09）。2026-08時点で2四半期連続乖離・修正検討入り</td><td>要変更</td><td>確定版3章／日本銀行時系列／2026-08レビュー</td></tr><tr><td>人件費・賃金</td><td>年率+2.5%</td><td>春闘実績+3.4%（上振れ）。都市交通の人件費KPIは未連携</td><td>要変更</td><td>確定版3章／2026-08レビュー</td></tr><tr><td>為替（ドル円）</td><td>140円</td><td>156.11円（2026-09-04）。都市交通への直接影響は計画上限定的（主に旅行・国際輸送・海外不動産）</td><td>要変更（ただし都市交通への影響は間接的）</td><td>確定版3章／FRED DEXJPUS</td></tr><tr><td>訪日外客数</td><td>年間4,000万人（都市交通にも影響）</td><td>前年比+12%ペース（上振れ方向）。都市交通の訪日連動輸送は未連携で個別確認不可</td><td>維持〜要監視</td><td>確定版3章／2026-08レビュー</td></tr><tr><td>旅客輸送人員（都市交通の中核需要前提）</td><td>万博閉幕後の反動減を2027年度前提に織り込み済み</td><td>未連携（実態データなし）</td><td>判定不能</td><td>確定版5.1／monitoring（都市交通・旅客輸送人員：未連携）</td></tr><tr><td>都市交通 事業利益目標</td><td>375（2024実績）→400（2027）→430（2029）</td><td>営業利益・売上とも未連携（実態データなし）</td><td>判定不能</td><td>確定版5章／monitoring（都市交通・営業利益／売上：未連携）</td></tr></tbody></table><p>（電力スポット価格は集計済みの monitoring_series をそのまま使用。平均・変化率は再計算していない。）</p><h2>③ 指摘（重要度別・事実／解釈／仮説を区分）</h2><p><strong>［高］金利前提0.25%は実勢0.98%と乖離、修正ルール該当（事実）</strong>\n2026-08レビューで「2四半期連続乖離・修正検討入り」と判定済み。都市交通は車両更新・駅周辺開発の投資を抱え、有利子負債の支払利息増が投資採算に影響する。経営影響：投資優先順位の再設定が必要。反映先＝新計画 第3章（前提）・第6章（投資配分）・第7章（財務方針）。根拠：確定版3章、2026-08レビュー。</p><p><strong>［高］人件費前提+2.5%と春闘実績+3.4%の乖離（事実）</strong>\n都市交通は要員集約型で、車両更新（累計320両）・安全投資に伴う人件費比重が高い。経営影響：事業利益375→430億円の積み上げ根拠に対する下押し要因。反映先＝新計画 第3章・第5.1（都市交通目標）。根拠：確定版3章・5.1、2026-08レビュー決定事項3。</p><p><strong>［中］都市交通の中核需要前提が実勢データで検証できない（事実）</strong>\n旅客輸送人員は monitoring 上未連携（実態データなし）。万博閉幕後の反動減の織り込みが妥当かを現時点で判定できない。経営影響：事業利益目標の信頼度が確認できない。反映先＝新計画 第5.1・第10章（先行指標）。根拠：確定版5.1、monitoring。</p><p><strong>［中］電力スポット価格の下振れと調達単価の乖離が未整理（事実＋解釈）</strong>\n実勢は計画前提25円/kWhを下回るが、2026-08レビューで「市場スポットと調達単価が乖離」とされ、運輸部が長期契約比率を整理する宿題が継続中。費用恩恵が損益に反映されるかは契約構造次第（解釈）。経営影響：費用計画の精度。反映先＝新計画 第3章・第5.1。根拠：確定版3章、2026-08レビュー決定事項2。</p><p><strong>［中］安全・人材の非財務KPIが都市交通に未設定（事実）</strong>\n確定版でも「未反映」宿題として2026-09経営会議へ持ち越し。都市交通は「安全を経営の最優先」と明記しており、KPI不在は計画整合上の欠落。反映先＝新計画 第9章・第10章。根拠：確定版9章、2026-05確定審議。</p><p><strong>［低］大阪市人口の集計範囲差（事実）</strong>\n実勢281.8万人と前提277万人の差は集計範囲差の可能性が2026-08レビューで指摘。方向は微増で沿線人口逓減リスク（確定版8章）とは逆向き。範囲確認前は単純比較不能。反映先＝新計画 第2章・第3章。根拠：大阪市推計人口、2026-08レビュー。</p><h2>外部情勢の変化点（AIの推論）</h2><ul><li><strong>推論</strong>：金利のある世界への移行が計画策定時想定より速い可能性。実勢0.98%は前提0.25%の約4倍で、鉄道の大型設備投資（車両更新・駅開発）の資金調達コストを押し上げる方向。根拠は日本銀行実勢値のみで、政策方向の断定材料は資料内にない。</li><li><strong>推論</strong>：賃上げの常態化（春闘+3.4%）は労働集約型の鉄道運行要員コストに構造的な上振れ圧力。運転士・保守要員の確保難と併せ、要員計画の見直し余地。実勢は+3.4%の一点のみで、都市交通固有の賃金データは未確認。</li><li><strong>推論</strong>：電力価格の短期変動は大きい（週次平均で8〜26円台、monitoring_series）。前提固定値25円/kWhでの費用計画は変動を捉えにくく、レンジ設定や調達構造の明示が望ましい。</li><li>（制度・競合動向：なにわ筋連絡線等の進捗、他社運賃改定などの外部情勢は資料・監視データに情報がなく、補完する根拠を持たないため記載しない。）</li></ul><h2>変化が新計画の数値目標へ与える影響</h2><ul><li>金利上振れ：都市交通の投資採算（ROIC基準）と支払利息配賦を通じて事業利益の下押し要因。→ 第6章の投資優先順位（劣後案件の事前指名は2026-09経営会議で決定予定）と第7章に反映。</li><li>人件費上振れ：都市交通事業利益（400→430億円）の費用側前提を+2.5%から実勢ベースへ再設定すると、目標達成に必要な単価・稼働改善幅が拡大。→ 第5.1と第3章に反映。</li><li>電力下振れ：費用面はプラスだが調達構造次第で恩恵が限定される可能性。過度な織り込みは避け、レンジ・調達比率を注記。→ 第3章に反映。</li><li>需要前提：旅客輸送人員の実勢が不明なため、事業利益目標そのものの上下判定は保留。データ連携後に再検証。</li></ul><h2>新計画書の素案枠（章立て・都市交通観点）</h2><ol><li>位置づけと前計画の総括（達成・未達・前提乖離の振り返り）</li><li>経営環境認識（金利・人件費の構造上昇、沿線人口、インバウンド定着）</li><li>計画前提（金利・人件費を実勢ベースへ更新 象年度：2027-2029年度</b></div><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>前期中計の都市交通章（5.1）は施策の柱（安全投資・車両更新320両・駅周辺開発・ダイヤ最適化・デジタル乗車券）と先行指標（旅客輸送人員 定期／定期外）を備えるが、電力価格・人件費前提の乖離と非財務KPIの未設定を新計画の章立てへ明示的に取り込む必要がある。新計画の章立ては前期構成を土台に「前提の感応度」「非財務KPI」「電力・要員コスト構造」を独立節へ格上げする形で提案する。</p><h2>経営判断</h2><p><strong>推奨：条件付きで前期構成を継承（章立ての組み直しを承認）。</strong> 前期の10章構成は都市交通の事業構造を概ね網羅しており全面改訂は不要だが、①前提の感応度、②非財務KPI（安全・人材）、③電力調達・要員コスト構造の3点を独立節へ格上げすることを条件とする。\n- 代替案A（前期構成をそのまま踏襲）：改訂負荷は最小。ただし電力・人件費の前提乖離と非財務KPI宿題が章の中に埋没するため不採（前期構成の良い点＝網羅性は活きるが、変化点が見えにくい弱み）。\n- 代替案B（KPI起点で全面再設計）：実行単位への落とし込みは最も進むが、確定版との継続性が切れ四半期レビュー資産を捨てる恐れ（成立条件：セグメントKPIの現場割付が完了していること。現状は輸送人員が未連携で確認不能）。</p><h2>最優先対応</h2><ol><li>都市交通章に「前提と感応度」節を新設し、電力25円/kWh前提と実勢の乖離、人件費+2.5%前提と春闘+3.4%の乖離を反映先として明記（責任：経営企画部、期限：新計画草案ドラフト時、開始条件：即時）。</li><li>非財務KPI（重大事故件数・従業員エンゲージメントスコアの候補2案）の反映先章を確定（責任：経営企画部、期限：2026年9月経営会議の決定を受けて、開始条件：9月決定）。</li><li>電力調達契約構造（長期契約比率）の整理結果を都市交通のコスト構造節へ紐づけ（責任：運輸部、期限：要設定、開始条件：運輸部の整理完了）。</li></ol><hr><h2>① 渡された資料の棚卸し</h2><table><thead><tr><th>資料名</th><th>扱う範囲</th></tr></thead><tbody><tr><td>中期経営計画2027-2029_確定版（アップロード全文／確定版・2026-09-01更新）</td><td>前提点検の主対象。都市交通は5.1・6.1・8章・9章が該当</td></tr><tr><td>2026-02_経営会議_中間審議_議事要旨</td><td>都市交通の指摘#6（万博反動減）、全社#3（非財務KPI）の出所</td></tr><tr><td>2026-05_経営会議_確定審議_議事要旨</td><td>指摘反映状況・宿題（非財務KPI未反映）の確認</td></tr><tr><td>2026-08_経営会議_第1四半期進捗レビュー_議事要旨</td><td>前提乖離状況（電力・人件費・人口）の確認</td></tr><tr><td>monitoring（都市交通の外部指標・内部KPI）</td><td>実勢値。内部KPIは全て未連携</td></tr></tbody></table><p>渡されていない資料（実際の輸送人員実績・要員計画・設備更新実績など）は参照していない。</p><h2>② 前期前提と直近実勢の突合（都市交通関連）</h2><table><thead><tr><th>前提・目標</th><th>前期の想定</th><th>直近の実勢</th><th>判定</th><th>出典</th></tr></thead><tbody><tr><td>電力スポット価格</td><td>25.0円/kWh（保守設定）</td><td>12.47円/kWh・5日比-40.7%</td><td>下振れ継続（費用面有利）</td><td>確定版3章／monitoring（JEPX 2026-09-12）／08月議事要旨</td></tr><tr><td>人件費・賃金</td><td>年率+2.5%</td><td>春闘実績+3.4%（実勢値は未連携）</td><td>上振れ方向。要員コスト計画に影響</td><td>確定版3章／08月議事要旨</td></tr><tr><td>大阪市人口</td><td>277万人（横ばい）</td><td>2,818,354人（281.8万人、2026-08-01）</td><td>集計範囲差を確認中。前期比較は範囲確認が lass=\"svelte-19qdtil\" data-scope-name=\"グループ開発室\">グループ開発室</span><em class=\"scope-pick-note\"></em></label></div></fieldset></div><button class=\"lg primary svelte-xzq5jh\"> 計画と実態の乖離を点検</button><div id=\"\" class=\"block svelte-1plpy97 padded hide-container auto-margin\" dir=\"ltr\" style=\"--start-top: 0px; --start-left: 0px; --start-width: 0px; --start-height: 0px; border-style: solid; overflow: visible; min-width: min(0px, 100%);\"><div data-testid=\"status-tracker\" class=\"wrap center full svelte-1uj8rng hide\" style=\"position: absolute; padding: 0px;\"></div><div class=\"html-container svelte-1jts93g\"><div id=\"html-337ox812b\" class=\" svelte-26mp0t\"><p class=\"mw-run-note\">計画と実態のずれ、放置した場合のリスク、対策案の順に示します。</p></div></div></div></div><div id=\"\" class=\"block svelte-1plpy97 padded hide-container auto-margin\" dir=\"ltr\" style=\"--start-top: 0px; --start-left: 0px; --start-width: 0px; --start-height: 0px; border-style: solid; overflow: visible; min-width: min(0px, 100%);\"><div data-testid=\"status-tracker\" class=\"wrap center full svelte-1uj8rng hide\" style=\"position: absolute; padding: 0px;\"></div><div class=\"html-container svelte-1jts93g\"><div id=\"html-xzan8boew\" class=\"prose gradio-style svelte-26mp0t\"><section class=\"mw-result\"><header><div><small>分析結果</small><h2>計画と実態の乖離検証</h2></div><div class=\"mw-source-chips\"><span>点検対象の計画｜中期経営計画2027-2029_確定版.docx</span></div></header><div class=\"mw-result-body\"><div class=\"mw-detected-meta\"><span>資料から読み取った計画情報</span><b>対象年度：2027-2029年度</b></div><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>中期経営計画2027-2029確定版は、為替（140円対実勢156円）と金利（0.25%対実勢0.98%）の2共通前提が2四半期連続で乖離し修正ルールに抵触しており、合算計画としての前提は現時点で成立していない。数値目標の骨格は維持可能だが、金利上昇に伴う投資優先順位・非財務KPIの2件が確定版時点で宿題のまま残り、点検上は「条件付きで成立」に留まる。</p><h2>経営判断</h2><p><strong>推奨は「条件付き実行（要監視）」。</strong> 計画の大枠（事業利益2027年度1,300億円・2029年度1,480億円）は据え置いたまま、共通前提の修正ルール（2四半期連続乖離）に従い、2026年9月経営会議で①為替・金利感応度に基づく年度計画の修正要否、②金利0.5%超時の投資劣後順位、③非財務KPIの3点を確定させることを条件とする。\n- 代替案A（差し戻し・全面再計画）：成立条件は、為替・金利乖離が事業利益計画の達成を構造的に不能にするとの感応度結果が出た場合。現時点で通期見込み-12億円（1,197対1,185）にとどまり、全面差し戻しの根拠は不足。\n- 代替案B（前提据え置き・監視のみ）：成立条件は、金利上昇の支払利息影響が軽微と確認できる場合。ただし金利は計画修正ルールに抵触済みで、監視のみは修正ルールと不整合のため非推奨。</p><h2>最優先対応（最大3件）</h2><ol><li>為替・金利の感応度分析と年度計画修正要否を2026年9月経営会議へ諮る（財務部、期限2026年9月、開始条件：2四半期連続乖離＝充足済み）。</li><li>金利0.5%超時に劣後させる投資案件の事前指名を確定し、遅延2案件（駅前A用地・共通データ基盤）を執行ペース見直しに載せる（財務部・経営企画部、期限2026年9月）。</li><li>安全・人材の非財務KPIを全社目標として確定する（経営企画部、期限2026年9月、開始条件：候補2案提示済み）。</li></ol><hr><h2>資料の棚卸し（扱う範囲）</h2><ul><li>中期経営計画2027-2029_確定版.docx：点検対象の計画本体（前提・数値目標・KPI・投資配分・個別案件）。</li><li>2026-05確定審議議事要旨：確定版決定と未反映2件（非財務KPI・エンタメ下振れ幅）、計画修正ルール。</li><li>2026-08第1四半期進捗レビュー議事要旨：共通前提の乖離判定と宿題進捗。</li><li>2026年度第1四半期業績・案件進捗レポート：2026年度Q1のセグメント計画対実績、個別案件進捗。</li><li>セグメント別事業利益実績_2020-2026_サンプル.csv：2020-2026年度の事業利益実績・見込（連結ベースと推定、範囲注記なし）。</li><li>2026-02中間審議議事要旨：確定前の指摘10件（対応追跡の起点）。</li><li>monitoring（外部指標実勢）：為替・金利・不動産価格指数・電力・人口。内部KPI（売上・営業利益・人件費）は全事業未連携。</li><li>参考として旅行取扱実績・鉄道運輸成績・国際輸送実績・ホテル概況（いずれも2025年の月次で、中計の集計範囲・期間と一致しないため単純比較には用いない）。</li><li>HHHD_PoC検証タスク管理・groupguide.pdfは本点検の計画突合には直接用いない。</li></ul><p>注：2026年度Q1業績・案件レポートと中計（2027-2029年度）は対象期間が異なる。Q1実績は前提乖離の兆候把握には使えるが、中計の年度計画値と直接の増減比較はしない。</p><h2>乖離一覧（計画値・実態値・乖離幅・出典）</h2><p>対応関係：計画値＝中計「3.計画の前提条件」の記載。実態値＝monitoring実勢（実データのみ）と進捗レビュー資料。集計範囲は前提指標（外部環境）ベース。</p><table><thead><tr><th>前提項目</th><th>計画値</th><th>実態値</th><th>乖離幅</th><th>出典</th><th>判定</th></tr></thead><tbody><tr><td>為替（ドル円）</td><td>140円</td><td>156.11円（2026-09-04, FRED DEXJPUS/旅行）</td><td>約+16円 円安</td><td>中計3章／monitoring</td><td>高：2四半期連続乖離、修正ルール抵触</td></tr><tr><td>金利（無担保コールO/N）</td><td>0.25%</td><td>0.977%（2026-09-09, 日銀時系列）</td><td>+0.73pt</td><td>中計3章／monitoring</td><td>高：2四半期連続乖離、0.5%超で投資順位論点発動</td></tr><tr><td>電力スポット価格</td><td>25.0円/kWh</td><td>12.47円/kWh（2026-09-12, JEPX）</td><td>約-12.5円 下振れ（費用面有利）</td><td>中計3章／monitoring</td><td>中：費用有利だが調達単価との差要確認</td></tr><tr><td>大阪市人口</td><td>277万人</td><td>2,818,354人（2026-08-01, 大阪市推計）</td><td>+約11.8万人</td><td>中計3章／monitoring</td><td>低：集計範囲差を確認中（比較不能の可能性）</td></tr><tr><td>大阪府不動産価格指数</td><td>150（横ばい）</td><td>159.7（2025-12-01, 国交省）</td><td>+9.7 上振れ</td><td>中計3章／monitoring</td><td>中：不動産に有利方向</td></tr><tr><td>訪日外客数</td><td>年4,000万人</td><td>前年比+12%ペース（進捗レビュー）</td><td>上振れ方向</td><td>進捗レビュー資料</td><td>中：monitoring未連携、水準は比較不能</td></tr><tr><td>人件費・賃金</td><td>+2.5%</td><td>春闘実績+3.4%（進捗レビュー）</td><td>+0.9pt 上振れ</td><td>進捗レビュー資料</td><td>中：2027年度予算編成で再設定予定</td></tr></tbody></table><p>補足（範囲の注意）：大阪市人口の計画277万人と実勢281.8万人は、進捗レビューで「集計範囲の差を確認中」とされており、範囲が確認できないため乖離幅は参考値。単純比較はできない。</p><h2>個別案件・施策の進捗差分</h2><p>出典：2026年度第1四半期業績・案件進捗レポート「4.個別案件の進捗」、中計6.1。</p><table><thead><tr><th>案件</th><th>計画（中計）</th><th>現状</th><th>判定</th><th>全社計画への影響</th></tr></thead><tbody><tr><td>芝田1丁目計画</td><td>計画期間内に着工</td><td>建設コスト+8%織込み再査定中</td><td>一時停止</td><td>不動産成長投資1,400億の執行時期に影響（重要度：高）</td></tr><tr><td>駅前A用地 複合開発</td><td>2027年度着工準備</td><td>用地按分調整に3か月、後ろ倒し</td><td>遅延</td><td>不動産・都市交通の按分＝連結消去ルール未確定と連動（高）</td></tr><tr><td>共通データ基盤</td><td>2027年度末β版</td><td>要件定義1Q遅延、連結消去ルール確定待ち</td><td>遅延</td><td>情報通信計上分100の連結消去、全社KPI接続に影響（中）</td></tr><tr><td>車両更新（第2期）</td><td>計画期間内320両</td><td>Q1で31両更新</td><td>計画どおり</td><td>更新・安全投資1,500億の枠内、影響小（低）</td></tr><tr><td>海外不動産 北米1号</td><td>2027年度取得</td><td>DD前倒し完了</td><td>前倒し</td><td>海外600億枠、資金前倒し需要（低〜中）</td></tr><tr><td>インバウンド富裕層商品</td><td>2026年度下期投入</td><td>開発完了、下期投入予定</td><td>計画どおり</td><td>旅行の第2の柱育成に整合（低）</td></tr></tbody></table><p>補足：遅延2案件（駅前A用地・共通データ基盤）はいずれも按分／連結消去ルール未確定が共通の根因であり、二重計上・連結消去の観点で早期確定が必要（進捗レポート5章、中計5.2/5.4）。</p><h2>放置した場合のリスク</h2><ul><li>金利乖離（0.25%→0.98%）：全社の支払利息が増加し、D/Eレシオ0.85倍（2029年度）と事業利益計画の達成余力を圧迫。0.5%超で投資優先順位の詳細基準が未確定のまま執行が続くと、劣後すべき案件の選別ができず投資枠3,200億の規律が緩む（重要度：高、出典：中計4章・7章・10章、進捗レビュー）。</li><li>為替乖離（140円→156円）：旅行の海外旅行需要と国際輸送採算に逆風。旅行はQ1で計画13→実績9（-4）、国際輸送は21→15（-6）と方向が計画に逆行しており、2027年度旅行52億・国際輸送75億の初年度立ち上がりに下振れ懸念（重要度：高、出典：Q1業績レポート2章）。</li><li>非財務KPI未設定：全社KPI（事業利益・ROE・D/Eの3点）が財務偏重のまま。中間審議指摘#3が確定版でも未反映で、9月経営会議で決めないと計画のKPI体系が未完のまま公表準備が進む（重要度：中、出典：確定審議議事要旨、中計9章）。</li><li>按分・連結消去ルール未確定：駅前A用地の投資・収益按分と共通データ基盤の計上分100の消去が未確定だと、事業間の二重計上リスクと合算精度の低下（重要度：中、出典：中 行残します）</p><div class=\"sns-weekly significant\"><span class=\"sns-weekly-week\">2026-W37</span><b>否定率が前の7日 5% から 8% へ増えました（3ポイント）。</b><em>直近7日 10371件／前の7日 6808件</em></div><p class=\"sns-freq-note\">測定の漏斗（取得した投稿が、各段階で何件残ったか）</p><ul class=\"sns-funnel\"><li><span>有効投稿</span><span class=\"sns-funnel-bar\"><i style=\"width:100%\"></i></span><b>10,407</b><em>取得した投稿から、ノイズと重複を除いた数</em></li><li><span>HHHD関連</span><span class=\"sns-funnel-bar\"><i style=\"width:100%\"></i></span><b>10,371</b><em>自社の事業 10151件・共同事業 220件を採用／非該当 36件を除外</em></li><li><span>AI判定済み</span><span class=\"sns-funnel-bar\"><i style=\"width:100%\"></i></span><b>10,371</b><em>AIの判定が付いていない 0件を除外。割合はこの件数から計算</em></li></ul><p class=\"sns-freq-note\">標本の厚み（いまの割合は何件から計算しているか）</p><p class=\"sns-instrument-note\">いまの割合は<b> 判定済み 10,371件</b>から計算しています。投稿は1日に約 1,743件たまります（うちAIの判定が付くものは約 1,743件）。直近7日がすべてこの速さでたまると、約 12,201件になります。</p><p class=\"sns-instrument-note\">件数を増やすと<b>数字のぶれは小さくなりますが、偏りは減りません</b>。投稿は無作為に集めたものではないため、件数を増やしても世の中全体（母集団）の割合に近づくとは限りません。偏りを減らすには、集める時間帯や検索語を変える必要があります。</p><p class=\"sns-freq-note\">測定器の状態（検索語を変えると数字が動きます。版が違う期間の時系列は接続できません）</p><p class=\"sns-instrument-note\">検索語はブランド名 60本、苦情の語 6本です。件数は、重複を除いた投稿数です。<br><b>11本が飽和しています（阪急電車、阪神電車、宝塚歌劇、宝塚歌劇団）</b>。検索で返るのは直近40件だけで、その40件が1日分に満たないため、間の投稿を取りこぼしています。取得の間隔を短くすると改善します。</p><ul class=\"sns-instrument\"><li><code>阪急電鉄</code><span>ブランド名</span><b>40</b><em>2日分</em></li><li><code>阪急電車</code><span>ブランド名</span><b>38</b><em>飽和（取りこぼし）</em></li><li><code>阪急線</code><span>ブランド名</span><b>39</b><em>4日分</em></li><li><code>阪急沿線</code><span>ブランド名</span><b>39</b><em>2日分</em></li><li><code>HANKYU</code><span>ブランド名</span><b>39</b><em>6日分</em></li><li><code>阪急京都線</code><span>ブランド名</span><b>40</b><em>2日分</em></li><li><code>阪急神戸線</code><span>ブランド名</span><b>39</b><em>3日分</em></li><li><code>阪急宝塚線</code><span>ブランド名</span><b>39</b><em>3日分</em></li><li><code>阪神電車</code><span>ブランド名</span><b>40</b><em>飽和（取りこぼし）</em></li><li><code>阪神電鉄</code><span>ブランド名</span><b>39</b><em>2日分</em window.__TURNS={"search": ["<div class=\"msg user\"><div><div>直近の有価証券報告書と決算説明会の資料をもとに、当社グループの海外不動産事業の現状と、経営が注視すべき課題を教えてください。</div></div></div>", "<div class=\"msg ai\"><div class=\"bubble\"><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>海外不動産事業は「ASEAN住宅分譲を軸に先進国へ拡大」という長期構想に沿って想定どおり伸長しており、直近半期は収益も前年同期比で増加しています。ただし規模拡大に伴う為替・金利感応度と撤退基準の未整備が経営の主な注視点です。</p><h2>次に確認すること</h2><ul><li>海外不動産の投資判断で使う為替・金利前提の感応度（決算説明会で開示要求が強まっている／2026-05質疑メモ）</li><li>海外不動産案件の撤退基準（IRR・保有年数）の明文化状況（投資委員会2026-07が承認の前提条件と申し合わせ済み）</li><li>エリア別・アセット別の投下資本と評価損リスクの内訳（金利上昇局面での評価下落への耐性）</li></ul><h2>現状（資料記載）</h2><ul><li>収益方向：海外不動産事業の営業収益は前中間期4,434百万円→当中間期6,288百万円（2026年3月期半期報告書、収益認識関係）。ここは連結・不動産セグメント内サブセグメントの数字で範囲は揃っています。半期報告書の不動産事業の増収要因の一つに「海外不動産事業が伸長」と明記。</li><li>事業ポートフォリオ：住宅分譲は累計64プロジェクト・約72,020戸（2025-09-30時点、共同事業者持分含む／2025年度第2四半期参考資料P41）。タイ38・ベトナム7・フィリピン10・インドネシア6が中心で、米国・豪州・カナダの賃貸住宅・物流・オフィスにも拡大。</li><li>位置づけ：長期構想で「不動産コアの収益の柱の一つ」とし、投下資本・事業利益を2025→2030→2040年度で拡大させる計画。短期成長投資の中心に海外不動産を置く（2025-05補足説明）。方向は明確に拡大。</li></ul><h2>経営が注視すべき課題</h2><ul><li><strong>為替・金利感応度の開示要求</strong>：アナリストから海外投資600億円の金利上昇局面での評価下落リスクと撤退基準を問われている（2026-05質疑メモ）。IR部も感応度の定量開示検討が必要と所感。→ 投資判断の透明性が資本市場評価に直結。</li><li><strong>撤退基準の未整備</strong>：投資委員会（2026-07）で海外不動産案件は撤退基準（IRR・保有年数）の明文化を承認の前提条件としており、北米・東南アジア案件400億円は為替・金利前提の感応度再提出を条件に保留中。→ 規模拡大の前に規律を固める必要。</li><li><strong>金利・為替の実勢</strong>：金利（無担保コールO/N）0.977%（2026-09-09・実データ）、ドル円156.11円（2026-09-04・実データ）。有報でも国際情勢・保有資産の時価下落・有利子負債リスクを明記（2026年提出有報29〜31ページ）。連結有利子負債は1兆4,345億円（同）。</li></ul><p>なお海外不動産の売上・営業利益はmonitoring上は未連携のため、セグメント収益の詳細な方向確認は半期報告書の記載値に依存します。</p><h2>議論すべき問い</h2><ul><li>海外不動産の投下資本拡大を続ける前提として、撤退基準（IRR・保有年数）をいつまでに明文化するか。</li><li>為替・金利の感応度を次回決算からどこまで定量開示するか。</li><li>ASEAN偏重と先進国拡大のバランスを、金利上昇局面でどう調整するか。</li></ul></div><details class=\"rag-evidence\"><summary>根拠を見る（社内資料・出典リスト）</summary><div class=\"rag-evidence-body\"><p>十分に関連する登録事例は見つかりませんでした。</p><h5>HHHD内部資料・開示資料</h5><ul><li><strong>長期経営構想説明会における 質疑応答</strong>（1〜2ページ）<br>\n…っていきたい。 </li></ul><p>Q 2030 年度に想定している事業利益 1,600 億円の達成に向けて、海外不 .pdf／https://www.hankyu-hanshin.co.jp/docs/d0957a406f55b07c3786f95febe6a64986c3fb59.pdf</p></div></details></div><div class=\"response-actions\" data-response-id=\"resp-722b7f4af5db41b589d9e475fd15f7bd\"><button type=\"button\" onclick=\"hhRateResponse('resp-722b7f4af5db41b589d9e475fd15f7bd','good',this)\">👍 役に立った</button><button type=\"button\" onclick=\"hhRateResponse('resp-722b7f4af5db41b589d9e475fd15f7bd','bad',this)\">👎 改善が必要</button><button type=\"button\" onclick=\"hhCopyResponse(this,'.bubble')\">⧉ 回答をコピー</button></div></div>"], "scenario": ["<div class=\"msg user\"><div><div>為替が1ドル170円まで円安が進み、政策金利が1.5%へ上がった場合、6事業それぞれへの影響を好影響と悪影響に分けて整理してください。</div></div></div>", "<div class=\"msg ai\"><div class=\"bubble\"><div class=\"chat-answer cgpt-answer\"><h2>結論</h2><p>1ドル170円・政策金利1.5%は「これから起こり得る事象」です。現行の計画前提（為替140円、金利0.25%＝中計2027-2029、2026年5月決定版）を大きく上回るため、6事業のうち有利子負債を抱える全社に支払利息増という悪影響が及び、旅行・国際輸送では円安による輸入・海外原価の増加が効く一方、インバウンド関連（旅行・エンタメ・都市交通）と海外資産（国際輸送・海外不動産）には円安が追い風となる、というのが根拠から読み取れる方向性です。</p><h2>経営判断</h2><p><strong>要監視。</strong> 現時点の実勢は金利0.977%（日銀時系列統計、2026-09-09）・為替156.11円（FRED DEXJPUS、2026-09-04）で、170円・1.5%はいずれも前提乖離のシナリオです。中計は「金利0.5%超で投資優先順位の劣後案件を事前指名」（財務部宿題、2026年9月経営会議）という条件を既に置いており、この閾値の運用と感応度の定量化を進める段階にあります。断定的な金額試算を置ける根拠がないため、方向性の整理と監視強化にとどめます。</p><h2>最優先対応</h2><ol><li><strong>金利1.5%到達時の支払利息増と投資劣後案件の確定</strong> — 有利子負債1兆円規模（アナリスト質疑メモ、2026-05）に対し金利上昇は全社の一次影響。中計財務方針は「金利上昇局面では有利子負債の圧縮を優先、投資はROIC基準で厳選」と明記。</li><li><strong>海外不動産・国際輸送の為替感応度の再提出</strong> — 投資委員会（2026-07）は海外不動産400億円を「為替・金利前提の感応度を再提出条件に保留」中。170円は前提140円から30円の乖離で、±10円感応度（中計）を大きく超える。</li><li><strong>旅行のインバウンド／海外旅行の両面影響の整理</strong> — 円安は訪日需要（好影響）と海外旅行需要（悪影響、中計リスク欄）に逆方向で効く。どちらが勝つかで事業損益の向きが変わる。</li></ol><h2>6事業への影響整理（方向性）</h2><p>数値の感応度を計算できる根拠がないため、影響の向きのみを示します。全事業共通の悪影響として、金利1.5%（前提0.25%比）による有利子負債の支払利息増があります（中計「主要リスクと対応」／アナリスト質疑メモ）。</p><table><thead><tr><th>事業</th><th>好影響</th><th>悪影響</th></tr></thead><tbody><tr><td>都市交通</td><td>円安による訪日客増で企画乗車券・駅ナカ収益に追い風（中計5.1、統合報告書の訪日記述）</td><td>支払利息増。電力・輸入資材の円安による調達コスト上昇（中計前提の電力・原油）</td></tr><tr><td>不動産</td><td>訪日・商業への集客追い風。海外賃貸開発の円換算収益は増える可能性（推論：中計「海外不動産の拡大」から）</td><td>支払利息増と資金調達コスト上昇。建設資材の円安による建設コスト上昇（中計リスク欄「建設コストの高騰」）</td></tr><tr><td>エンタテインメント</td><td>円安による訪日客の観戦・観劇需要増（中計5.3、リスク欄「インバウンド」）</td><td>支払利息増。輸入物販・エネルギーコストの上昇（推論）</td></tr><tr><td>情報・通信</td><td>明確な好影響は根拠から読み取れない</td><td>支払利息増。機器・システムに輸入要素があれば円安でコスト増（推論）</td></tr><tr><td>旅行</td><td>訪日（インバウンド）需要の増加。中計は「インバウンドを第2の柱」と位置づけ</td><td>海外旅行需要の減少（中計リスク欄「為替の急変→海外旅行の需要減」）。支払利息増</td></tr><tr><td>国際輸送</td><td>円安で日本発着輸出貨物・海外現地収益の円換算額が増える可能性（推論）</td><td>燃料費の円安によるコスト増。採算悪化（中計リスク欄「為替の急変→国際輸送の採算悪化」）。支払利息増</td></tr></tbody></table><p>補足（方向の確認）：旅行は好影響（訪日増）と悪影響（海外旅行減）が逆を向くため、結論を一方向に決められません。国際輸送も収益の円換算増（好）と燃料コスト増（悪）が拮抗します。中計は為替リスクへの対応として「燃油サーチャージの価格転嫁、日本発着クルーズの拡販」「荷主構成の転換」を挙げており、価格転嫁の可否が正味の向きを左右します。</p><h2>反証・留意点</h2><ul><li><strong>反証（金利）</strong>：中計財務方針は「長期・固定調達比率の維持」を明記しており、金利上昇の支払利息への波及は変動金利部分に限られる可能性があります。固定・変動比率が根拠にないため、支払利息増の規模は確認が必要です。</li><li><strong>不動産の資産価値</strong>：金利上昇はキャップレート上昇（賃貸不動産の評価下押し）につながり得ますが、これを裏付ける定量根拠は本資料になく、方向性の指摘にとどめます。大阪府不動産価格指数は159.7・5か月比+5.3%（国交省、2025-12）と上昇方向で、金利シナリオの下押しとは逆を向いている点は付記します。</li><li>国際輸送の貨物取扱量は未連携のため、輸送量ベースの影響は確認できません（1行のみ）。</li></ul><h2>対応案の比較（金利上昇への財務対応）</h2><table><thead><tr><th>案</th><th>利点</th><th>代償</th><th>成立条件</th></tr></thead><tbody><tr><td>A. 有利子負債圧縮を優先（資産売却前倒し）</td><td>支払利息増を直接抑制。中計方針と整合</td><td>成長投資枠が細る。資産売却1,000億円の未達リスク</td><td>売却市況が悪化していない</td></tr><tr><td>B. 投資の選別・劣後案件の執行停止</td><td>機動枠を温存。ROIC基準に沿う</td><td>海外不動産・国際輸送の成長が遅れる</td><td>劣後案件の事前指名が完了（2026年9月経営会議の宿題）</td></tr><tr><td>C. 現状維持で監視継続</td><td>実勢は0.977%・156円で前提内の余地</td><td>1.5%・170円が急伸した場合に対応が後手</td><td>乖離が2四半期連続しない</td></tr></tbody></table><h2>推奨と見送り</h2><p><strong>推奨はB（投資の選別・劣後案件の事前指名を先に確定）</strong>。理由は、中計が既に「金利0.5%超で劣後案件を事前指名」という手順を宿題化しており、170円・1.5%という強い前提が来る前に順序を決めておくのが最も低コストで可逆的だからです。Aは資産売却市況に依存し前倒しの副作用が大きく見送り、Cは急伸時の対応が遅れるため単独では不十分です。</p><h2>対応開始条件</h2><ul><li><strong>投資劣後の発動（B）</strong>：政策金利が1.5%到達、または無担保コールO/Nが継続的に上昇し中計の「0.5%超」水準を2四半期連続で超えたら開始（中計・議事要旨の修正ルール）。</li><li><strong>有利子負債圧縮の強化（A）</strong>：金利1.5%到達かつD/Eレシオが2029年度目標0.85倍から乖離拡大したら開始（中計財務方針）。</li><li><strong>旅行の商品転換</strong>：為替が170円方向へ進み海外旅行需要が減少に転じたら国内・訪日商品へ転換（中計リスク欄の運用）。閾値の数値根拠は本資料になく、需要指標の連携が必要。</li></ul><h2>撤回条件</h2><ul><li>政策金利・為替が中計前提（0.25%／140円近辺）へ戻り、乖離が2四半期連続で解消したら劣後・圧縮対応を撤回（修正ルール）。</li><li>価格転嫁（燃油サーチャージ等）が浸透し国際輸送・旅行の採算が回復したら、当該事業の防御的対応を縮小。</li></ul><h2>意思決定メモ（最終確認が必要）</h2><ul><li>結論：170円・1.5%シナリオでは全社に支払利息増、旅行・国際輸送は為替が両方向に作用。対応の中心は投資劣後案件の事前指名（案B）。</li><li>担当：財務部（金利・劣後案件）、旅行事業本部（需要転換）、経営企画部（感応度定量化）。</li><li>期限：劣後案件の優先順位は2026年9月経営会議（議事要旨の宿題）。</li><li>開始条件／撤回条件：上記見出しのとおり。</li><li>次回確認日：2026年9月経営会議（宿題期限）。</li><li>未確定事項：①有利子負債の固定・変動比率、②為替・金利の感応度（金額）、③キャップレート影響。いずれも根拠不足のため確認前に決定済みとはしない。</li></ul><h2>管理層が議論すべき問い</h2><ol><li>有利子負債1兆円規模のうち変動金利部分はいくらか。金利1.5%で支払利息はどの程度増えるか。</li><li>円安170円下で、旅行と国際輸送の「訪日増・輸出増」と「海外旅行減・燃料増」の正味はどちらに振れるか。価格転嫁はどこまで可能か。</li><li>劣後させる投資案件（海外不動産400億円等）の事前指名を、どの金利水準で発動するか。</li></ol><p>（補足：金利は実データ0.977%、為替は156.11円が現在値で、いずれも設問前提より緩やか。170円・1.5%は前提乖離のシナリオとして扱っています。）</p></div><details class=\"rag-evidence\"><summary>根拠を見る（社内資料・出典リスト）</summary><div class=\"rag-evidence-body\"><h5>登録事例</h5><ul><li><strong>2016年 マイナス金利政策</strong>（関連度 弱・80%）<br>\nマイナス金利政策（マイナスきんりせいさく、英: negative interest rate policy）とは、中央銀行が名目金利をゼロ未満のマイナス金利に設定する金融政策。金融緩和政策の一種。\n金融機関による中央銀行への余剰預金に金利を支払うようにすることで、金融機関に融資や投資へ資金を回すように促し、経済を刺激させる目的で行われる。<br>\n対応：</li><li><strong>2022年 2022年の急速な円安</strong>（関連度 弱・78%）<br>\n円相場（えんそうば）は、円に対する外貨の相対的価値（為替レート）のこと。通常は外貨1単位に相当する円貨額で表示する（通貨や市場によっては別の慣行もある）。\n特に、米ドルやユーロとの比較によって示され、その中でも、米ドルに対する円の相対価値を示すことがある。<br>\n対応：</li><li><strong>2013年 量的・質的金融緩和</strong>（関連度 弱・75%）<br>\n大規模金融緩和が金利、為替、不動産投資環境に長期的影響を与えた。<br>\n対応：</li><li><strong>2023–年 賃上げの拡大</strong>（関連度 弱・75%）<br>\n物価上昇と人手不足を背景に賃上げが進み、人件費、採用競争、価格転嫁、生産性向上が一体の課題となった。<br>\n対応：</li></ul><h5>HHHD内部資料・開示資料</h5><ul><li><strong>中期経営計画2016-2018_確定版.docx</strong>（全文）<br>\n…旅行者は2015年に1,970万人と急増し、百貨店・ホテル・交通の消費を押し上げている。マイナス金利政策(2016年2月導入)により調達環境は歴史的な低水準にあり、成長投資の好機である。一方、人口減少の先行きと郊外部の沿線需要の頭打ちが中長期の課題であり、沿線価値の向上と非鉄道事業の育成による収益源の多様化を進める。< /* ── 待つ／止まる ──────────────────────────────── */
class Cancelled extends Error {}
function sleep(ms, tk){
  return new Promise((res, rej) => {
    const start = performance.now();
    let waited = 0;
    const step = () => {
      if (tk !== token) return rej(new Cancelled());
      if (!playing) { return setTimeout(step, 120); }   // 一時停止中は時間を進めない
      waited += 40;
      if (waited >= ms) return res();
      setTimeout(step, 40);
    };
    setTimeout(step, 0);
  });
}

function openClipped(){
  // アプリは画面1枚に収める作りなので、あちこちの箱が「中だけスクロール」になっている。
  // 長い紙として見せるため、中身より低い箱を見つけて、その連なりの高さの縛りを外す。
  // 横並び（flex）の指定は触らない。前に一律で触ったときは要素が重なった。
  for (let round = 0; round < 3; round++){
    const bad = [...app.querySelectorAll("*")].filter(e =>
      e.clientHeight > 300 && e.scrollHeight - e.clientHeight > 40 &&
      !e.closest(".demo-cursor") && !/^(TEXTAREA|SELECT)$/.test(e.tagName));
    if (!bad.length) break;
    for (const e0 of bad){
      let e = e0;
      while (e && e !== app){
        for (const [k,v] of [["height","auto"],["max-height","none"],["min-height","0"],["overflow","visible"],["overflow-y","visible"]])
          e.style.setProperty(k, v, "important");
        e = e.parentElement;
      }
    }
  }
}

function hideResults(viewSel, btnText){
  const view = shadow.querySelector(viewSel); if (!view) return;
  const kids = [...view.children];
  const i = kids.findIndex(e => (e.textContent||"").includes(btnText));
  // 結果のタブは .hh-tabpane.is-active{display:block!important} で出る作りなので、
  // 隠すほうも !important でないと負ける（押す前からレポートが見えていた原因）。
  kids.slice(i + 1).forEach(e => { e.dataset.demoResult = "1"; e.style.setProperty("display", "none", "important"); });
}
function revealResults(viewSel){
  shadow.querySelectorAll(`${viewSel} [data-demo-result]`).forEach(e => { e.style.removeProperty("display"); e.classList.add("demo-reveal"); });
  openClipped();
}

function showView(id, snap){
  shadow.querySelectorAll(".hh-view").forEach(e => e.classList.toggle("hh-show", e.id === id || (id === "view-planpremise" && e.id === "view-planning")));
  shadow.querySelectorAll(".hh-topnav-item").forEach(e => e.classList.toggle("is-active", ("view-" + e.dataset.view) === id || (id === "view-planpremise" && e.dataset.view === "planning")));
  // 「← ホームへ戻る」の帯は、本物ではホーム以外の画面で出る（JSが出し分けている）。同じにする。
  const back = shadow.querySelector("#management-home-return");
  if (back) back.style.setProperty("display", id === "view-home" ? "none" : "block", "important");
  openClipped();
  pan(0, snap);
}

/* ── 位置合わせ ───────────────────────────────── */
function fit(){
  const box = stage.getBoundingClientRect();
  scale = box.width / 1600;
  openClipped();
  pan(panY, true);
}
function visibleH(){ return stage.getBoundingClientRect().height / scale; }
function contentH(){
  const shown = [...shadow.querySelectorAll(".hh-view.hh-show")];
  const bottom = Math.max(1000, ...shown.map(v => { const p = scenePos(v); return p.y + p.h; }));
  return bottom + 24;
}
function pan(y, snap){
  const maxY = Math.max(0, contentH() - visibleH());
  panY = Math.max(0, Math.min(maxY, y));
  screen.classList.toggle("snap", !!snap);
  screen.style.transform = `translateY(${-panY * scale}px) scale(${scale})`;
  const sb = app && app.querySelector(".hh-sidebar");
  if (sb){ sb.classList.toggle("snap", !!snap); sb.style.height = visibleH() + "px"; sb.style.transform = `translateY(${panY}px)`; }
  if (snap) requestAnimationFrame(() => { screen.classList.remove("snap"); sb && sb.classList.remove("snap"); });
}
function scenePos(el){
  const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
  return { x:(r.left - a.left)/scale, y:(r.top - a.top)/scale, w:r.width/scale, h:r.height/scale };
}
async function panTo(el, offset, tk){
  openClipped();
  const p = scenePos(el);
  // 要素が見えている範囲に入っていれば動かさない
  const top = p.y - offset;
  if (p.y >= panY + 40 && p.y + Math.min(p.h, 400) <= panY + visibleH() - 40) return;
  pan(top, false);
  await sleep(950, tk);
}

/* ── カーソル ─────────────────────────────────── */
function findEl(sel, text, root){
  const scope = root ? shadow.querySelector(root) : shadow;
  const list = [...scope.querySelectorAll(sel)];
  if (text == null) return list[0] || null;
  return list.find(e => (e.textContent||"").replace(/\s+/g," ").includes(text)) || null;
}
async function moveTo(el, tk, dx = 0, dy = 0){
  cursor.classList.add("on");
  await panTo(el, 220, tk);
  const p = scenePos(el);
  cursor.style.left = (p.x + Math.min(p.w/2, 120) + dx) + "px";
  cursor.style.top  = (p.y + p.h/2 + dy) + "px";
  await sleep(650, tk);
  el.classList.add("demo-hover");
  await sleep(320, tk);
}
async function click(el, tk){
  const x = parseFloat(cursor.style.left), y = parseFloat(cursor.style.top);
  ripple.style.left = x + "px"; ripple.style.top = y + "px";
  ripple.classList.remove("go"); void ripple.offsetWidth; ripple.classList.add("go");
  el.classList.remove("demo-hover");
  await sleep(380, tk);
}
async function press(sel, text, tk, root){
  const el = findEl(sel, text, root);
  if (!el) { console.warn("見つからない:", sel, text); return null; }
  await moveTo(el, tk);
  await click(el, tk);
  return el;
}
function hideCursor(){ cursor.classList.remove("on"); }

/* ── 入力と逐次表示 ────────────────────────────── */
async function type(el, text, tk){
  el.classList.add("demo-typing"); el.value = "";
  for (const ch of text){
    el.value += ch;
    el.dispatchEvent(new Event("input", {bubbles:true}));
    await sleep(/[、。]/.test(ch) ? 230 : 42 + Math.random()*46, tk);
  }
  await sleep(500, tk);
  el.classList.remove("demo-typing");
}
function el(html){ const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; }

/* 回答待ちの吹き出し（アプリの progress_bubble_html と同じ作り） */
const STEPS = ["質問の意図を読み取っています","社内資料・開示資料から根拠を検索しています","該当ページの前後を読み込んでいます","回答を作成しています"];
const DONE  = {"質問の意図を読み取っています":"質問の意図を読み取りました","該当ページの前後を読み込んでいます":"該当ページの前後を読み込みました"};
const done = s => DONE[s] || (s.endsWith("しています") ? s.slice(0,-5)+"しました" : s);
async function thinking(box, tk, secs){
  const msg = el(`<div class="msg ai"><div class="bubble"><div class="ai-progress"><ul class="ai-steps"></ul></div></div></div>`);
  box.appendChild(msg); openClipped();
  const ul = msg.querySelector(".ai-steps");
  for (let i = 0; i < STEPS.length; i++){
    ul.innerHTML = STEPS.slice(0,i).map(s=>`<li class="is-done">${done(s)}</li>`).join("")
                 + `<li class="is-now"><span class="spinner"></span>${STEPS[i]}</li>`;
    await panTo(msg, 260, tk);
    await sleep(secs[i] || 900, tk);
  }
  return msg;
}
/* 回答を段落ごとに流し込む（本物も逐次表示なので、同じ見え方にする） */
async function stream(box, html, tk, follow = true, budgetMs = 24000){
  const src = el(html);                      // <div class="msg ai"><div class="bubble"><div class="chat-answer">…
  const answer = src.querySelector(".chat-answer") || src.querySelector(".bubble") || src;
  const parts = [...answer.childNodes].filter(n => n.nodeType === 1 || (n.nodeType === 3 && n.textContent.trim()));
  const totalLen = parts.reduce((a, n) => a + (n.textContent||"").length, 0);
  answer.innerHTML = "";
  box.appendChild(src);
  const caret = el(`<span class="ai-stream-caret"></span>`);
  answer.appendChild(caret);
  let shown = 0;
  for (const n of parts){
    if (n.nodeType === 1) n.classList.add("demo-reveal");
    answer.insertBefore(n, caret);
    shown++;
    if (shown % 6 === 1) openClipped();
    if (follow && shown % 2 === 0) await panTo(n, visibleH() - 260, tk);
    const len = (n.textContent||"").length;
    await sleep(Math.max(220, Math.min(1400, budgetMs * (len + 40) / (totalLen + 40 * parts.length))), tk);
  }
  caret.remove();
  return src;
}

/* 処理中の帯（アプリの hhAiBusy と同じ見た目で、見えている位置に置く） */
async function busy(label, secs, tk){
  let band = shadow.querySelector("#hh-ai-global");
  if (!band){
    band = el(`<div id="hh-ai-global" class="hh-ai-global" role="status"><span class="hh-ai-global-spin"></span><span class="hh-ai-global-body"><span class="hh-ai-global-txt"></span><span class="hh-ai-bar"><i></i></span></span><span class="hh-ai-pct"></span></div>`);
    app.appendChild(band);
  }
  band.querySelector(".hh-ai-global-txt").textContent = label;
  band.style.top = (panY + 18) + "px";
  band.classList.add("is-on");
  const bar = band.querySelector(".hh-ai-bar i"), pct = band.querySelector(".hh-ai-pct");
  const t0 = performance.now();
  while (true){
    const p = Math.min(1, (performance.now() - t0) / (secs*1000));
    // 本物と同じく、終盤はゆっくり（100%で止まらないよう95%まで）
    const shown = Math.round((1 - Math.pow(1-p, 2)) * 95);
    bar.style.width = shown + "%"; pct.textContent = shown + "%";
    if (p >= 1) break;
    await sleep(120, tk);
  }
  bar.style.width = "100%"; pct.textContent = "100%";
  await sleep(300, tk);
  band.classList.remove("is-on");
}

function focusItem(i){ [...$("#n-list").children].forEach((li, j) => li.classList.toggle("on", j === i)); }
async function now(html, tk, ms = 0){

    <p class="wrap-note">本デモは実際のアプリとデータで動作しています。</p>
  </div>`
};

/* ── 進行 ─────────────────────────────────────── */
ACTS.forEach((a, i) => {
  const seg = document.createElement("i"); rail.appendChild(seg);
  const b = document.createElement("button"); b.className = "dot-btn"; b.textContent = i + 1; b.title = a.label;
  b.addEventListener("click", () => go(i)); dots.appendChild(b);
});

function render(i){
  const a = ACTS[i];
  document.querySelectorAll("#slot-slide").forEach(e => e.remove());
  if (a.slide){
    stage.hidden = true; notes.hidden = true;
    deck.insertAdjacentHTML("afterbegin", SLIDES[a.slide]);
  } else {
    stage.hidden = false; notes.hidden = false;
    $("#stage-tag").textContent = a.tag || "";
    $("#n-now").classList.add("dim");
    fit();
  }
  [...dots.children].forEach((b, j) => b.setAttribute("aria-current", j === i ? "true" : "false"));
  [...rail.children].forEach((seg, j) => { seg.classList.toggle("done", j < i); seg.classList.toggle("now", j === i); seg.style.setProperty("--p", j < i ? "100%" : (j === i ? "35%" : "0%")); });
  clock.textContent = `${String(i+1).padStart(2,"0")} / ${String(ACTS.length).padStart(2,"0")}　${a.label}`;
}

async function go(i){
  token++;
  const tk = token;
  act = (i + ACTS.length) % ACTS.length;
  mount();                                   // 章の頭ごとにアプリを初期状態から立て直す
  // それより前の章で起きたことのうち、画面に残るべき状態だけを先に作る
  for (let j = 2; j < act; j++) if (ACTS[j].prepare) ACTS[j].prepare();
  if (ACTS[act].prepare) ACTS[act].prepare();
  render(act);
  hideCursor();
  try {
    await ACTS[act].run(tk);
    if (tk !== token) return;
    if (autoAdvance) go(act + 1);
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

function setPlaying(on){
  playing = on;
  playBtn.textContent = on ? "一時停止" : "再生";
  clock.textContent = `${String(act+1).padStart(2,"0")} / ${String(ACTS.length).padStart(2,"0")}　${ACTS[act].label}${on ? "" : "　（一時停止中）"}`;
}
playBtn.addEventListener("click", () => setPlaying(!playing));
$("#prev").addEventListener("click", () => go(act - 1));
$("#next").addEventListener("click", () => go(act + 1));
addEventListener("keydown", e => {
  if (e.key === " "){ e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") go(act + 1);
  else if (e.key === "ArrowLeft")  go(act - 1);
  else if (/^[1-9]$/.test(e.key))  go(+e.key - 1);
  else if (e.key === "0") go(9);
});
addEventListener("resize", () => { if (app) fit(); });

go(0);
</script>
