<title>総会QA ウォークスルー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">

<style>
/* ============================================================
   AI経営ナビ ウォークスルー（操作再生版）
   暗い操作卓の中に、実際のアプリ画面を置いて「触っている」様子を再生する。
   枠の色はアプリの紺青とずらし、画面と競らせない。
   ============================================================ */
:root{
  --ground:#0F1319; --panel:#171D26; --panel-2:#1E2631;
  --line:#2A3542; --line-soft:#222C38;
  --fg:#E9EDF2; --fg-dim:#8FA0B2; --fg-faint:#66788B;
  --accent:#E0A14A; --bezel:#05080C;
  --stage-w:1060px; --stage-h:662px;
  --f-display:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,monospace;
}
:root[data-theme="light"]{
  --ground:#EDF0F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --line:#D3DBE4; --line-soft:#E3E9EF;
  --fg:#141A21; --fg-dim:#56677A; --fg-faint:#8494A5; --accent:#A2661A; --bezel:#C9D2DC;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --ground:#EDF0F4; --panel:#FFFFFF; --panel-2:#F6F8FA; --line:#D3DBE4; --line-soft:#E3E9EF;
    --fg:#141A21; --fg-dim:#56677A; --fg-faint:#8494A5; --accent:#A2661A; --bezel:#C9D2DC;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.rail{position:sticky;top:0;z-index:40;display:flex;gap:3px;padding:0 22px;height:4px;background:var(--ground)}
.rail i{flex:1;background:var(--line);border-radius:2px;overflow:hidden;position:relative}
.rail i::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--accent);transition:width .3s linear}
.rail i.done::after{width:100%}
.rail i.now::after{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

.top{display:flex;align-items:baseline;gap:14px;padding:16px 26px 10px;border-bottom:1px solid var(--line-soft)}
.top .mark{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.top .who{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.02em}
.top .note{margin-left:auto;font-size:12px;color:var(--fg-faint)}

.deck{display:grid;grid-template-columns:var(--stage-w) minmax(300px,1fr);gap:28px;align-items:start;padding:22px 26px 0;max-width:1500px;margin:0 auto}
@media (max-width:1240px){.deck{grid-template-columns:1fr}:root{--stage-w:100%}}

/* 画面（操作卓にはめ込んだ紙面） */
.stage{position:relative;width:100%;height:var(--stage-h);background:var(--bezel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 18px 40px -24px rgba(0,0,0,.8)}
.stage .viewport{position:absolute;inset:0;overflow:hidden}
.stage .screen{position:absolute;top:0;left:0;width:1600px;transform-origin:top left;background:#EDF2F2;transition:transform .9s cubic-bezier(.22,.61,.36,1)}
.stage .screen.snap{transition:none}
.stage .tag{position:absolute;left:12px;bottom:10px;z-index:3;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;color:#cfd8e2;background:rgba(8,12,18,.72);backdrop-filter:blur(3px);padding:3px 8px;border-radius:4px}
.stage .live{position:absolute;right:12px;bottom:10px;z-index:3;display:flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:10px;letter-spacing:.14em;color:#cfd8e2;background:rgba(8,12,18,.72);padding:3px 8px;border-radius:4px}
.stage .live i{width:6px;height:6px;border-radius:50%;background:#E4695F;animation:pulse 1.2s ease-in-out infinite}

/* 説明の欄 */
.notes{padding-top:2px;min-height:var(--stage-h);display:flex;flex-direction:column}
.notes[hidden],.stage[hidden]{display:none!important}
.notes .step{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);margin-bottom:8px}
.notes h2{font-family:var(--f-display);font-weight:900;font-size:24px;word-break:keep-all;overflow-wrap:anywhere;line-height:1.35;margin:0 0 10px;text-wrap:balance;letter-spacing:.01em}
.notes .lead{color:var(--fg-dim);font-size:14px;margin:0 0 16px;max-width:38em}
.notes ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.notes li{display:grid;grid-template-columns:auto 1fr;gap:10px;font-size:13.4px;line-height:1.7;opacity:.42;transition:opacity .4s}
.notes li.on{opacity:1}
.notes li::before{content:"";width:5px;height:5px;margin-top:9px;border-radius:50%;background:var(--accent)}
.notes li b{font-weight:700;color:var(--fg)}
.notes .now{margin-top:auto;padding:12px 14px;border-left:2px solid var(--accent);background:var(--panel);border-radius:0 8px 8px 0;font-size:13px;color:var(--fg-dim);min-height:64px;transition:opacity .25s}
.notes .now b{color:var(--fg)}
.notes .now.dim{opacity:0}

/* 全面スライド */
.slide{grid-column:1/-1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:38px 44px;min-height:var(--stage-h)}
.slide.title{display:flex;flex-direction:column;justify-content:center;background:linear-gradient(150deg,var(--panel) 0%,var(--panel-2) 100%)}
.slide.title .eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--accent);margin-bottom:18px}
.slide.title h1{font-family:var(--f-display);font-weight:900;font-size:clamp(34px,4.4vw,54px);line-height:1.22;margin:0 0 18px;text-wrap:balance;letter-spacing:.01em}
.slide.title p{max-width:46em;color:var(--fg-dim);font-size:15.5px;margin:0}
.slide.title .meta{margin-top:30px;display:flex;flex-wrap:wrap;gap:10px 26px;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);letter-spacing:.06em}
.slide h2.big{font-family:var(--f-display);font-weight:900;font-size:30px;margin:0 0 6px;letter-spacing:.01em;text-wrap:balance}
.slide .sub{color:var(--fg-dim);font-size:14px;margin:0 0 26px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.colhead{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;color:var(--accent);padding-bottom:8px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.scenes{display:grid;gap:14px}
.scene-item{display:grid;grid-template-columns:auto 1fr;gap:13px;align-items:start}
.scene-item .n{font-family:var(--f-mono);font-size:11px;color:var(--fg-faint);padding-top:4px;min-width:3.4em}
.scene-item h3{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 2px}
.scene-item p{margin:0;font-size:13px;color:var(--fg-dim);line-height:1.65}
.feats{display:grid;gap:9px}
.feat{display:grid;grid-template-columns:auto 1fr;gap:11px;font-size:13.2px;line-height:1.65}
.feat .dot{width:6px;height:6px;margin-top:9px;border-radius:50%;background:var(--accent)}
.feat b{font-weight:700}.feat span{color:var(--fg-dim)}
.points{margin-top:26px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media (max-width:900px){.points{grid-template-columns:1fr}}
.point h4{font-family:var(--f-display);font-weight:700;font-size:14px;margin:0 0 5px;display:flex;align-items:baseline;gap:8px}
.point h4 em{font-family:var(--f-mono);font-style:normal;font-size:10.5px;color:var(--accent);letter-spacing:.1em}
.point p{margin:0;font-size:12.6px;color:var(--fg-dim);line-height:1.65}
.wrap-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:8px}
@media (max-width:900px){.wrap-grid{grid-template-columns:1fr}}
.wrap-card{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.wrap-card h4{font-family:var(--f-display);font-weight:700;font-size:15px;margin:0 0 7px}
.wrap-card p{margin:0;font-size:13px;color:var(--fg-dim);line-height:1.7}
.wrap-note{margin-top:24px;font-size:12.5px;color:var(--fg-faint);border-top:1px solid var(--line);padding-top:14px}

/* 操作 */
.bar{position:sticky;bottom:0;z-index:30;margin-top:24px;display:flex;align-items:center;gap:14px;padding:12px 26px;background:var(--ground);border-top:1px solid var(--line-soft)}
.btn{font-family:var(--f-body);font-size:12.5px;font-weight:500;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 13px;cursor:pointer;line-height:1}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#12161C;font-weight:700;min-width:84px}
.btn.main:hover{filter:brightness(1.08);color:#12161C}
.dots{display:flex;gap:6px;margin-left:6px;flex-wrap:wrap}
.dot-btn{width:26px;height:22px;border-radius:5px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--fg-faint);font-family:var(--f-mono);font-size:10px;line-height:1;padding:0}
.dot-btn[aria-current="true"]{background:var(--accent);border-color:var(--accent);color:#12161C;font-weight:500}
.bar .clock{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--fg-faint);letter-spacing:.08em}
.hint{padding:0 26px 22px;font-size:11.5px;color:var(--fg-faint)}
@media (prefers-reduced-motion: reduce){.stage .screen{transition:none}.rail i::after{transition:none;animation:none}}
</style>

<div class="rail" id="rail" aria-hidden="true"></div>

<header class="top">
  <span class="mark">Walkthrough</span>
  <span class="who">総会QAアプリ</span>
  <span class="note">画面はすべて実際のアプリのものです（架空企業「デモ・ホールディングス」のデータで動作）</span>
</header>

<main class="deck" id="deck">
  <div class="slide title" id="slot-slide">
    <div class="eyebrow">SHAREHOLDERS MEETING Q&A</div>
    <h1>株主総会の想定問答を、<br>4つの工程でひとつに</h1>
    <p>質問づくりから回答、AIの点検と承認、問答集の出力、当日の高速検索まで。
       総会準備の流れに沿って、実際に操作しながらご覧いただきます。</p>
    <div class="meta">
      <span>全 10 章・約 5 分</span>
      <span>自動再生／スペースキーで一時停止</span>
      <span>デモ用の架空企業データ</span>
    </div>
  </div>
  <div class="stage" id="slot-stage" hidden>
    <div class="viewport"><div class="screen" id="screen" role="img" aria-label="アプリの画面"></div></div>
    <div class="live"><i></i>OPERATING</div>
    <div class="tag" id="stage-tag"></div>
  </div>
  <div class="notes" id="slot-notes" hidden>
    <div class="step" id="n-step"></div>
    <h2 id="n-title"></h2>
    <p class="lead" id="n-lead"></p>
    <ul id="n-list"></ul>
    <div class="now dim" id="n-now"></div>
  </div>
</main>

<div class="bar">
  <button class="btn main" id="play">一時停止</button>
  <button class="btn" id="prev">← 前の章</button>
  <button class="btn" id="next">次の章 →</button>
  <div class="dots" id="dots"></div>
  <span class="clock" id="clock"></span>
</div>
<p class="hint">スペース＝再生／一時停止、←→＝章の移動、数字キー＝その章へ。番号を押しても移動できます。</p>

window.__TURNS={"chat": ["<div class=\"agm2-msg user\">今年の株主総会で、鉄道の安全対策と沿線開発について株主から追及されそうな点を3つ挙げ、それぞれの回答の要点も教えてください。</div>", "<div class=\"agm2-msg ai\" id=\"agm2-ai-resp-737883af5cdc4c8b9198a4d5b28ba53f\"><h1>株主総会 想定追及ポイント（鉄道安全・沿線開発）</h1><p>承認済み問答を土台に、追及されやすい3点を整理します。</p><hr><h2>① 異常時（人身事故・遅延）の運行対応</h2><p><strong>関連問答：Q115（折り返し運転）</strong></p><p><strong>想定追及</strong>\n「事故時の復旧が遅い。折り返し運転をなぜもっと早く実施しないのか」</p><p><strong>回答の要点</strong>\n- 折り返し運転は、上下線の方向転換が可能な運転設備を備えた特定駅間でのみ実施可能。\n- 乗務員・運行管理係員・案内係員の確保と体制整備に一定の時間を要する。\n- 安全確保を最優先する運用である旨を丁寧に説明。</p><hr><h2>② 自然災害・気象への備え</h2><p><strong>関連問答：Q126（降雪対策）</strong></p><p><strong>想定追及</strong>\n「近年の異常気象・大雪で運休が発生した。備えは十分か」</p><p><strong>回答の要点</strong>\n- 厳寒期の安定運行のため凍結防止処置を規定化。気象予報・沿線気象観測情報に応じ「融雪器」使用、車両の通電（パンタグラフ上昇）状態維持等を実施。\n- 一方で、相互直通運転先（湊西電鉄線）のトラブルに起因する遅延・運休は自社単独では制御しにくい構造的課題であることも正直に補足。\n- ※2023年1月寒波では自社線内で運転見合わせ・駅間停止は発生しなかった実績に触れる。</p><hr><h2>③ 沿線の顧客対応・利用環境（バリアフリー／観光）</h2><p><strong>関連問答：Q116（障害者差別解消法）、Q208（高嶺山インバウンド）</strong></p><p><strong>想定追及</strong>\n- 「バリアフリー・障害者対応は法令水準を満たしているか」\n- 「沿線・観光開発でインバウンド収益を伸ばせているのか」</p><p><strong>回答の要点</strong>\n- 差別解消法対応として、要望内容の理解、応じられない場合の理由・代替案の丁寧な説明、お客様への声がけを教育で徹底。引き続き教育に努める。\n- 観光面ではQ208の実績が語れる：2025年度インバウンド延べ217千人（前年比▲25千人／▲10.3%）。ケーブル運休や中国渡航自粛の影響で減少も、2019年度（207千人）を上回る水準。</p><hr><h2>リハーサル上の注意</h2><ul><li><strong>未承認の数値は使わない</strong>：復旧所要時間、設備投資額、駅別バリアフリー整備率などを問われても、承認問答にない数字は「持ち帰り確認」とする。</li><li><strong>相直の他社要因</strong>は自社責任と混同されやすいので、切り分けて説明する準備を。</li></ul><p>より深掘りしたい論点があれば、その方向で追及役を演じます。</p></div>", "<div class=\"agm2-msg-actions\"><div class=\"response-actions\" data-response-id=\"resp-737883af5cdc4c8b9198a4d5b28ba53f\"><button type=\"button\" onclick=\"hhRateResponse('resp-737883af5cdc4c8b9198a4d5b28ba53f','good',this)\">👍 役に立った</button><button type=\"button\" onclick=\"hhRateResponse('resp-737883af5cdc4c8b9198a4d5b28ba53f','bad',this)\">👎 改善が必要</button><button type=\"button\" onclick=\"hhCopyResponse(this,'#agm2-ai-resp-737883af5cdc4c8b9198a4d5b28ba53f')\">⧉ 回答をコピー</button></div></di くるべきだ\n国の動向や他社の状況、またお客様からのご要望の推移から、多数のお客様のご支持をいただくことは難しいと考えており、現在のところ導入する予定はない。\n（５）女性専用車両に男性が乗車している\n2025年2月のダイヤ改正により、西線で女性専用車両がある通勤特急の本数が増加して以降、女性専用車両と知らずにご乗車されている男性のお客様が一定数発生しているため、車内案内放送等で引き続き周知に努めていく。\nなお、女性専用車両は小学生以下のお子様、お身体の不自由なお客様やその介助者であれば男性でもご乗車いただける。また、法的拘束力がなく、男性のお客様のご協力のもと、実施しているものである。\n（６）なぜ、男性が乗車していても直接声をかけないのか\n女性専用車両は、お客様のご理解とご協力のうえで実施しているものであり、昨今の性的多様性への配慮に対する社会的要請の高まりに加えて、内部障がいのあるお客様への対応が困難であること等も踏まえて、外見上男性のお客様が乗車されていても、原則こちらからお声かけは行っていない。\nお身体の不自由なお客様等の乗車に関するご意見\n（１）男性で身体障がいがあり、女性専用車両以外の車両への移動が不便である\n女性専用車両は、小学生以下のお子様、お身体の不自由なお客様とその介助者の男性もご乗車いただける。\n（２）上記の男性が乗車可であっても、実際には乗車しにくい\n車側ステッカーや車内のステッカー等で、ご乗車いただけることをPRしているので、遠慮なくご乗車いただきたい。\n（３）ヘルプマークを付けていると男性は乗車できるのか\nヘルプマークを着用されているお客様は、外見から分からなくても援助や配慮を必要としている方であり、その大半は女性専用車両にご乗車いただける男性の条件である「お身体の不自由なお客様」に含まれると考えられる。\n迷惑行為防止に関するご意見\n（１）迷惑行為防止に関する一般回答\n・当社としても痴漢は卑劣な行為であると認識しており、さらに列車の遅れにつながる事象でもあるため、痴漢抑止に向けた啓発は重要であると考えている。\n・車内秩序保持のため車内防犯カメラの設置（2027年度末までに全編成に整備完了予定）や 車掌による車内巡視や迷惑行為防止に関する車内・駅構内放送を適宜行うとともに、痴漢防止キャンペーン等を実施して、迷惑行為の撲滅に努めているほか、鉄道警察隊も可能な範囲で列車に乗車し、巡回を行っている。\n・またホームページのFAQに鉄道警察隊および警察庁のリンクを追加し、被害に遭ったお客様の相談窓口等を分かりやすく案内している。\n・沿線大学（湊西女子大学）や湊南圏の他の鉄道事業者や警察と連携して、痴漢防止ポスターを作成し、駅構内や車内ディスプレイにて掲出・放映を行っているほか、痴漢抑止活動センター主催の痴漢抑止バッジデザインコンテストへの協賛も行っている。\n（２）特に大学や高校の入試時期を狙った痴漢行為が問題視されているが、対策はおこなっているのか\n・入試期間中も含め年間を通じて、上記の取組みを実施しているが、特に受験生のご利用の多い大学入試共通テストの当日には、駅構内放送による啓発も追加で実施している。", "", ""], "btns": ["×", "回答を保存", "保存して承認に再提出", "承認する", "却下する", "承認を解除", "却下を確定"], "w": 820, "h": 920}, "export_table": "<div class=\"agm2-toolbar-inline\" style=\"display:flex;align-items:center;gap:10px;margin:6px 0 10px\"><span class=\"agm2-selcount\">0問を選択中</span><span class=\"agm2-spacer\" style=\"flex:1\"></span><button type=\"button\" class=\"agm2-btn\">すべて選択</button><button type=\"button\" class=\"agm2-btn agm2-export-btn\">Excel出力</button><button type=\"button\" class=\"agm2-btn primary agm2-export-btn\">Word出力（まとめて1ファイル）</button></div><div class=\"agm2-tblwrap\"><table class=\"agm2-table agm2-w-wide\"><thead><tr><th></th><th>番号< function openClipped(){
  // アプリは画面1枚に収める作りなので、あちこちの箱が「中だけスクロール」になっている。
  // 長い紙として見せるため、中身より低い箱を見つけて、その連なりの高さの縛りを外す。
  // 横並び（flex）の指定は触らない。前に一律で触ったときは要素が重なった。
  for (let round = 0; round < 3; round++){
    const bad = [...app.querySelectorAll("*")].filter(e =>
      e.clientHeight > 300 && e.scrollHeight - e.clientHeight > 40 &&
      !e.closest(".demo-cursor") && !/^(TEXTAREA|SELECT)$/.test(e.tagName));
    if (!bad.length) break;
    for (const e0 of bad){
      let e = e0;
      while (e && e !== app){
        for (const [k,v] of [["height","auto"],["max-height","none"],["min-height","0"],["overflow","visible"],["overflow-y","visible"]])
          e.style.setProperty(k, v, "important");
        e = e.parentElement;
      }
    }
  }
}

function hideResults(viewSel, btnText){
  const view = shadow.querySelector(viewSel); if (!view) return;
  const kids = [...view.children];

  // 結果のタブは .hh-tabpane.is-active{display:block!important} で出る作りなので、
  // 隠すほうも !important でないと負ける（押す前からレポートが見えていた原因）。
  kids.slice(i + 1).forEach(e => { e.dataset.demoResult = "1"; e.style.setProperty("display", "none", "important"); });
}
function revealResults(viewSel){

function showView(id, snap){

/* ── 位置合わせ ───────────────────────────────── */
function fit(){
  const box = stage.getBoundingClientRect();
  scale = box.width / 1600;
  openClipped();
  pan(panY, true);
}
function visibleH(){ return stage.getBoundingClientRect().height / scale; }
function contentH(){
  const shown = [...shadow.querySelectorAll(".hh-view.hh-show")];
  const bottom = Math.max(1000, ...shown.map(v => { const p = scenePos(v); return p.y + p.h; }));
  return bottom + 24;
}
function pan(y, snap){
  const maxY = Math.max(0, contentH() - visibleH());
  panY = Math.max(0, Math.min(maxY, y));
  screen.classList.toggle("snap", !!snap);
  screen.style.transform = `translateY(${-panY * scale}px) scale(${scale})`;
  const sb = app && app.querySelector(".hh-sidebar");
  if (sb){ sb.classList.toggle("snap", !!snap); sb.style.height = visibleH() + "px"; sb.style.transform = `translateY(${panY}px)`; }
  if (snap) requestAnimationFrame(() => { screen.classList.remove("snap"); sb && sb.classList.remove("snap"); });
}
function scenePos(el){
  const r = el.getBoundingClientRect(), a = app.getBoundingClientRect();
  return { x:(r.left - a.left)/scale, y:(r.top - a.top)/scale, w:r.width/scale, h:r.height/scale };
}
async function panTo(el, offset, tk){
  openClipped();
  const p = scenePos(el);
  // 要素が見えている範囲に入っていれば動かさない
  const top = p.y - offset;
  if (p.y >= panY + 40 && p.y + Math.min(p.h, 400) <= panY + visibleH() - 40) return;
  pan(top, false);
  await sleep(950, tk);
}

/* ── カーソル ─────────────────────────────────── */
function findEl(sel, text, root){
  const scope = root ? shadow.querySelector(root) : shadow;
  const list = [...scope.querySelectorAll(sel)];
  if (text == null) return list[0] || null;
  return list.find(e => (e.textContent||"").replace(/\s+/g," ").includes(text)) || null;
}
async function moveTo(el, tk, dx = 0, dy = 0){
  cursor.classList.add("on");
  await panTo(el, 220, tk);
  const p = scenePos(el);
  cursor.style.left = (p.x + Math.min(p.w/2, 120) + dx) + "px";
  cursor.style.top  = (p.y + p.h/2 + dy) + "px";
  await sleep(650, tk);
  el.classList.add("demo-hover");
  await sleep(320, tk);
}
async function click(el, tk){
  const x = parseFloat(cursor.style.left), y = parseFloat(cursor.style.top);
  ripple.style.left = x + "px"; ripple.style.top = y + "px";
  ripple.classList.remove("go"); void ripple.offsetWidth; ripple.classList.add("go");
  el.classList.remove("demo-hover");
  await sleep(380, tk);
}
async function press(sel, text, tk, root){
  const el = findEl(sel, text, root);
  if (!el) { console.warn("見つからない:", sel, text); return null; }
  await moveTo(el, tk);
  await click(el, tk);
  return el;
}

async function type(el, text, tk){
  el.classList.add("demo-typing"); el.value = "";

    el.dispatchEvent(new Event("input", {bubbles:true}));
    await sleep(/[、。]/.test(ch) ? 230 : 42 + Math.random()*46, tk);

}

/* 回答待ちの吹き出し（アプリの progress_bubble_html と同じ作り） */
const STEPS = ["質問の意図を読み取っています","社内資料・開示資料から根拠を検索しています","該当ページの前後を読み込んでいます","回答を作成しています"];
const DONE  = {"質問の意図を読み取っています":"質問の意図を読み取りました","該当ページの前後を読み込んでいます":"該当ページの前後を読み込みました"};
const done = s => DONE[s] || (s.endsWith("しています") ? s.slice(0,-5)+"しました" : s);
async function thinking(box, tk, secs){
  const msg = el(`<div class="msg ai"><div class="bubble"><div class="ai-progress"><ul class="ai-steps"></ul></div></div></div>`);
  box.appendChild(msg); openClipped();
  const ul = msg.querySelector(".ai-steps");
  for (let i = 0; i < STEPS.length; i++){
    ul.innerHTML = STEPS.slice(0,i).map(s=>`<li class="is-done">${done(s)}</li>`).join("")
                 + `<li class="is-now"><span class="spinner"></span>${STEPS[i]}</li>`;
    await panTo(msg, 260, tk);
    await sleep(secs[i] || 900, tk);
  }
  return msg;
}
/* 回答を段落ごとに流し込む（本物も逐次表示なので、同じ見え方にする） */
async function stream(box, html, tk, follow = true, budgetMs = 24000){
  const src = el(html);                      // <div class="msg ai"><div class="bubble"><div class="chat-answer">…
  const answer = src.querySelector(".chat-answer") || src.querySelector(".bubble") || src;
  const parts = [...answer.childNodes].filter(n => n.nodeType === 1 || (n.nodeType === 3 && n.textContent.trim()));
  const totalLen = parts.reduce((a, n) => a + (n.textContent||"").length, 0);
  answer.innerHTML = "";
  box.appendChild(src);
  const caret = el(`<span class="ai-stream-caret"></span>`);
  answer.appendChild(caret);
  let shown = 0;
  for (const n of parts){
    if (n.nodeType === 1) n.classList.add("demo-reveal");
    answer.insertBefore(n, caret);
    shown++;
    if (shown % 6 === 1) openClipped();
    if (follow && shown % 2 === 0) await panTo(n, visibleH() - 260, tk);
    const len = (n.textContent||"").length;
    await sleep(Math.max(220, Math.min(1400, budgetMs * (len + 40) / (totalLen + 40 * parts.length))), tk);
  }
  caret.remove();
  return src;
}

/* 処理中の帯（アプリの hhAiBusy と同じ見た目で、見えている位置に置く） */
async function busy(label, secs, tk){
  let band = shadow.querySelector("#hh-ai-global");
  if (!band){
    band = el(`<div id="hh-ai-global" class="hh-ai-global" role="status"><span class="hh-ai-global-spin"></span><span class="hh-ai-global-body"><span class="hh-ai-global-txt"></span><span class="hh-ai-bar"><i></i></span></span><span class="hh-ai-pct"></span></div>`);
    app.appendChild(band);
  }
  band.querySelector(".hh-ai-global-txt").textContent = label;
  band.style.top = (panY + 18) + "px";
  band.classList.add("is-on");
  const bar = band.querySelector(".hh-ai-bar i"), pct = band.querySelector(".hh-ai-pct");
  const t0 = performance.now();
  while (true){
    const p = Math.min(1, (performance.now() - t0) / (secs*1000));
    // 本物と同じく、終盤はゆっくり（100%で止まらないよう95%まで）
    const shown = Math.round((1 - Math.pow(1-p, 2)) * 95);
    bar.style.width = shown + "%"; pct.textContent = shown + "%";
    if (p >= 1) break;
    await sleep(120, tk);
  }
  bar.style.width = "100%"; pct.textContent = "100%";
  await sleep(300, tk);
  band.classList.remove("is-on");
}

/* ── 進行 ─────────────────────────────────────── */
ACTS.forEach((a, i) => {
  const seg = document.createElement("i"); rail.appendChild(seg);
  const b = document.createElement("button"); b.className = "dot-btn"; b.textContent = i + 1; b.title = a.label;
  b.addEventListener("click", () => go(i)); dots.appendChild(b);
});

function render(i){
  const a = ACTS[i];
  document.querySelectorAll("#slot-slide").forEach(e => e.remove());
  if (a.slide){
    stage.hidden = true; notes.hidden = true;
    deck.insertAdjacentHTML("afterbegin", SLIDES[a.slide]);
  } else {
    stage.hidden = false; notes.hidden = false;
    $("#stage-tag").textContent = a.tag || "";
    $("#n-now").classList.add("dim");
    fit();
  }
  [...dots.children].forEach((b, j) => b.setAttribute("aria-current", j === i ? "true" : "false"));
  [...rail.children].forEach((seg, j) => { seg.classList.toggle("done", j < i); seg.classList.toggle("now", j === i); seg.style.setProperty("--p", j < i ? "100%" : (j === i ? "35%" : "0%")); });
  clock.textContent = `${String(i+1).padStart(2,"0")} / ${String(ACTS.length).padStart(2,"0")}　${a.label}`;
}

async function go(i){
  token++;
  const tk = token;
  act = (i + ACTS.length) % ACTS.length;
  mount();                                   // 章の頭ごとにアプリを初期状態から立て直す
  // それより前の章で起きたことのうち、画面に残るべき状態だけを先に作る
  for (let j = 2; j < act; j++) if (ACTS[j].prepare) ACTS[j].prepare();
  if (ACTS[act].prepare) ACTS[act].prepare();
  render(act);
  hideCursor();
  try {
    await ACTS[act].run(tk);
    if (tk !== token) return;
    if (autoAdvance) go(act + 1);
  } catch (e) {
    if (!(e instanceof Cancelled)) console.error(e);
  }
}

function setPlaying(on){
  playing = on;
  playBtn.textContent = on ? "一時停止" : "再生";
  clock.textContent = `${String(act+1).padStart(2,"0")} / ${String(ACTS.length).padStart(2,"0")}　${ACTS[act].label}${on ? "" : "　（一時停止中）"}`;
}
playBtn.addEventListener("click", () => setPlaying(!playing));
$("#prev").addEventListener("click", () => go(act - 1));
$("#next").addEventListener("click", () => go(act + 1));
addEventListener("keydown", e => {
  if (e.key === " "){ e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") go(act + 1);
  else if (e.key === "ArrowLeft")  go(act - 1);
  else if (/^[1-9]$/.test(e.key))  go(+e.key - 1);
  else if (e.key === "0") go(9);
});
addEventListener("resize", () => { if (app) fit(); });

go(0);
</script>
